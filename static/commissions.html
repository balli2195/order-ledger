<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commissions · Myrddin Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441c'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23fff8f2' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<style>
  .cm-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 26px 0 0; }
  .cm-head h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0; }
  .cm-rule { color: var(--muted); font-size: 13px; margin: 6px 0 0; max-width: 760px; }
  .stats .stat.main { border-color: var(--accent); }
  .stats .stat .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .cm-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius, 12px); padding: 14px 18px 8px; margin-top: 16px; }
  .cm-card h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .cm-chart svg { display: block; width: 100%; height: 170px; overflow: visible; }
  .cm-chart .axis { fill: var(--muted); font-size: 11px; }
  .cm-chart .val { fill: var(--ink); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cm-chart .grid { stroke: var(--line-2); }
  .cm-chart rect.bar { fill: var(--accent); }
  .cm-chart rect.bar.cur { fill: color-mix(in srgb, var(--accent) 55%, var(--panel)); }
  table.mo tr.mo-row { cursor: pointer; }
  table.mo .chev { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
  table.mo tr.mo-row.open .chev { transform: rotate(90deg); }
  table.mo tr.mo-row.open td { background: var(--panel-2); border-bottom-color: transparent; }
  table.mo tr.mo-row .cur { font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 1px 7px; margin-left: 6px; font-weight: 600; }
  table.mo tr.mo-detail > td { background: var(--panel-2); padding: 4px 14px 18px; cursor: default; }
  table.mo tr.mo-detail:hover { background: none; }
  table.mo td.dim, table.mo .dim { color: var(--muted); }
  table.ld tr.no td { color: var(--muted); }
  table.mo th.pd, table.mo td.pd { width: 52px; text-align: center; }
  .pd-box { display: inline-flex; padding: 6px; margin: -6px; cursor: pointer; }
  .pd-box input { width: 17px; height: 17px; accent-color: var(--ok); cursor: pointer; margin: 0; }
  .pd-box input:disabled { cursor: default; }
  table.mo tr.mo-row.paid td:not(.pd) { color: var(--muted); }
  table.mo tr.mo-row.paid td b { color: var(--muted); font-weight: 500; }
  .pd-diff { font-size: 11px; color: var(--bad); }
  table.ld .why { font-size: 11px; color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); border-radius: 99px; padding: 1px 7px; white-space: nowrap; }
  table.ld td.prod { max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="brand">Myrddin Hub</h1>
    </div>
    <div class="who">
      <span id="whoami" class="muted"></span>
      <button id="menuBtn" class="btn ghost">Menu ▾</button>
      <div id="menu" class="menu hidden">
        <button data-go="/#activity">Activity log</button>
        <button data-go="/#connect">Connect Claude</button>
        <button data-go="/#users" class="owner-only hidden">Users &amp; logins</button>
        <hr>
        <button data-act="logout">Sign out</button>
      </div>
    </div>
  </header>
  <nav class="tabs"><a href="/tasks" data-tab="tasks">Inbox</a><a href="/leads" data-tab="leads">Leads</a><a href="/" data-tab="orders">Orders</a><a href="/inventory-health" data-tab="inventory_health">Inventory health</a><a href="/lead-db" data-tab="sephora_leads">Lead DB</a><a href="/timeclock" data-tab="timeclock">Time clock</a><a href="/reimbursements" data-tab="reimbursements">Reimbursements</a><a href="/profit" data-tab="profit">Profit</a><a href="/commissions" data-tab="commissions" class="on">Commissions</a></nav>

  <div class="cm-head"><h2>Commissions</h2><span class="muted" id="whoLine"></span></div>
  <div class="stats" id="stats"></div>
  <div class="cm-card"><h3>By week</h3><div class="cm-chart" id="chart"></div></div>

  <div class="cm-head" style="margin-top:22px"><h2 style="font-size:22px">Weeks</h2><span class="muted" style="font-size:13px">click a week to see its leads</span></div>
  <div class="table-wrap"><table class="mo" id="moTable"></table></div>
</div>
<div id="toasts" class="toasts"></div>
<script src="/static/viewas.js"></script>
<script src="/static/clock.js"></script>
<script src="/static/bonus.js"></script>
<script src="/static/common.js"></script>
<script>
(() => {
  const { $, esc, money, api, fail } = LG;
  const S = { data: null, open: new Set(), cache: {} };
  const day = (ymd) => { const [y, m, d] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); };
  const addDays = (ymd, n) => { const d = day(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const short = (ymd, o = { month: 'short', day: 'numeric' }) => day(ymd).toLocaleDateString('en-US', { ...o, timeZone: 'UTC' });
  const wkLabel = (w, year) => { const e = addDays(w, 6); return `${short(w)} – ${w.slice(5, 7) === e.slice(5, 7) ? short(e, { day: 'numeric' }) : short(e)}${year ? ', ' + e.slice(0, 4) : ''}`; };
  const pctTxt = (r) => (r * 100).toFixed(r * 100 % 1 ? 1 : 0) + '%';

  async function load() {
    S.data = await api('GET', '/api/commissions');
    if (!S.open.size) S.open.add(S.data.this_week);
    await Promise.all([...S.open].map(fetchWeek));
    render();
  }
  async function fetchWeek(w) { if (!S.cache[w]) S.cache[w] = await api('GET', '/api/commissions/' + w); }

  function render() {
    const D = S.data, by = Object.fromEntries(D.weeks.map((w) => [w.week, w]));
    $('#whoLine').textContent = D.owner ? `${D.who} · ${pctTxt(D.rate)} of spend` : `${pctTxt(D.rate)} of spend`;
    const cur = by[D.this_week], last = by[addDays(D.this_week, -7)];
    const stat = (k, v, sub, main) => `<div class="stat ${main ? 'main' : ''}"><div class="k">${k}</div><div class="v">${v}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
    $('#stats').innerHTML =
      stat('This week', money(cur?.commission || 0), `${wkLabel(D.this_week)} · ${money(cur?.spend || 0, 0)} bought`, true) +
      stat('Last week', money(last?.commission || 0), `${wkLabel(addDays(D.this_week, -7))} · ${money(last?.spend || 0, 0)} bought`) +
      stat('Unpaid', money(D.unpaid), 'finished weeks not ticked off') +
      stat('Since ' + short(D.start), money(D.total), `${money(D.total_spend, 0)} bought`);
    renderChart();
    renderWeeks();
  }

  function renderChart() {
    const D = S.data, by = Object.fromEntries(D.weeks.map((w) => [w.week, w]));
    const weeks = []; for (let i = 11; i >= 0; i--) { const w = addDays(D.this_week, -7 * i); if (w >= D.start) weeks.push(w); }
    const vals = weeks.map((w) => by[w]?.commission || 0), max = Math.max(...vals, 1);
    const W = Math.max($('#chart').clientWidth || 760, 320), H = 170, pl = 8, pb = 22, pt = 16, bw = Math.min((W - pl) / Math.max(weeks.length, 1), 90);
    const y = (v) => H - pb - (v / max) * (H - pb - pt);
    const bars = weeks.map((w, i) => {
      const v = vals[i], x = pl + i * bw + bw * 0.18, bwid = bw * 0.64, top = y(v);
      return `<g><title>${wkLabel(w, true)}: ${money(v)}</title>
        <rect class="bar ${w === D.this_week ? 'cur' : ''}" x="${x}" y="${top}" width="${bwid}" height="${Math.max(H - pb - top, v ? 1 : 0)}" rx="3"></rect>
        ${v && bw >= 52 ? `<text class="val" x="${x + bwid / 2}" y="${top - 4}" text-anchor="middle">${money(v, 0)}</text>` : ''}
        <text class="axis" x="${x + bwid / 2}" y="${H - 6}" text-anchor="middle">${short(w)}</text></g>`;
    }).join('');
    $('#chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Commission by week (last 12 weeks)">
      <line class="grid" x1="${pl}" x2="${W}" y1="${H - pb}" y2="${H - pb}"></line>${bars}</svg>`;
  }

  function renderWeeks() {
    const D = S.data, yr = D.this_week.slice(0, 4);
    const head = `<thead><tr><th>Week</th><th class="num">Leads bought</th><th class="num">Units</th><th class="num">Spend</th><th class="num">Commission</th><th class="num">Not counted</th><th class="pd">Paid</th></tr></thead>`;
    if (!D.weeks.length) { $('#moTable').innerHTML = head + '<tbody><tr><td colspan="7" class="empty">No leads yet.</td></tr></tbody>'; return; }
    const body = D.weeks.map((w) => {
      const open = S.open.has(w.week);
      const p = w.paid, cur = w.week === D.this_week;
      const tip = p ? `Paid ${new Date(p.paid_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}${p.paid_by ? ' by ' + p.paid_by : ''} · ${money(p.amount)}` : (D.owner ? 'Tick once this week is paid' : 'Not paid yet');
      const diff = p && Math.abs(Number(p.amount) - w.commission) >= 0.01;
      const row = `<tr class="mo-row ${open ? 'open' : ''} ${p ? 'paid' : ''}" data-w="${w.week}">
        <td><span class="chev">▸</span> <b>${wkLabel(w.week, addDays(w.week, 6).slice(0, 4) !== yr)}</b>${w.week === D.this_week ? '<span class="cur">this week</span>' : ''}</td>
        <td class="num">${w.bought}</td><td class="num">${Number(w.units).toLocaleString()}</td><td class="num">${money(w.spend)}</td>
        <td class="num"><b>${money(w.commission)}</b>${diff ? `<div class="pd-diff" title="Changed after it was paid (e.g. a canceled order)">paid ${money(p.amount)}</div>` : ''}</td>
        <td class="num dim" title="Leads with ${esc(D.who)} as the sourcer that someone else added">${w.other_n ? `${w.other_n} · ${money(w.other_spend, 0)}` : '·'}</td>
        <td class="pd"><label class="pd-box" title="${esc(tip)}"><input type="checkbox" data-paid="${w.week}" ${p ? 'checked' : ''} ${D.owner ? '' : 'disabled'}></label></td></tr>`;
      if (!open) return row;
      const d = S.cache[w.week];
      return row + `<tr class="mo-detail"><td colspan="7">${d ? detail(d) : '<div class="muted" style="padding:10px">Loading…</div>'}</td></tr>`;
    }).join('');
    $('#moTable').innerHTML = head + `<tbody>${body}</tbody>`;
  }

  function detail(d) {
    if (!d.leads.length) return '<div class="muted" style="padding:10px">Nothing bought on these leads yet.</div>';
    return `<div class="table-wrap" style="margin-top:8px"><table class="ld"><thead><tr><th>Date</th><th>Product</th><th>Store</th>
      <th class="num">Cost</th><th class="num">Bought</th><th class="num">Spend</th><th class="num">Commission</th></tr></thead><tbody>
      ${d.leads.map((l) => `<tr class="${l.counts ? '' : 'no'}"><td>${short(l.lead_date, { weekday: 'short', month: 'short', day: 'numeric' })}</td>
        <td class="prod" title="${esc(l.product_name || '')}"><span class="mono">${esc(l.asin || '')}</span> ${esc(l.product_name || '')}</td>
        <td>${esc((l.stores || []).join(', '))}</td><td class="num">${money(l.cost)}</td><td class="num">${l.qty_ordered}</td>
        <td class="num">${money(l.actual_spend)}</td>
        <td class="num">${l.counts ? money(l.commission) : `<span class="why">added by ${esc(l.added_by || 'someone else')}</span>`}</td></tr>`).join('')}
      </tbody></table></div>`;
  }

  $('#moTable').addEventListener('click', async (e) => {
    if (e.target.closest('.pd-box')) return;
    const r = e.target.closest('tr.mo-row'); if (!r) return;
    const w = r.dataset.w;
    if (S.open.has(w)) S.open.delete(w); else { S.open.add(w); renderWeeks(); try { await fetchWeek(w); } catch (err) { fail(err); } }
    renderWeeks();
  });

  $('#moTable').addEventListener('change', async (e) => {
    const cb = e.target.closest('input[data-paid]'); if (!cb) return;
    cb.disabled = true;
    try { S.data = await api('POST', '/api/commissions/paid', { week: cb.dataset.paid, paid: cb.checked }); render(); }
    catch (err) { cb.checked = !cb.checked; cb.disabled = false; fail(err); }
  });

  LG.header().then(load).catch(fail);
  let rz = null; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => S.data && renderChart(), 150); });
  let t = null;
  LG.live?.((msg) => { if (msg.t === 'lead') { clearTimeout(t); t = setTimeout(() => { S.cache = {}; load().catch(() => {}); }, 4000); } });
})();
</script>
</body>
</html>
