<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profit · Myrddin Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441c'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23fff8f2' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<style>
  .pf-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 26px 0 0; }
  .pf-head h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0; }
  .pf-head .sp { flex: 1; }
  .pf-range { display: flex; gap: 6px; align-items: center; }
  .pf-range input { width: 140px; padding: 5px 8px; }
  .pf-toggle { white-space: nowrap; display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
  #presets { overflow-x: auto; max-width: 100%; } #presets .chip { white-space: nowrap; }
  .stat.big .v { font-size: 24px; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .v.pos { color: var(--ok); } .v.neg { color: var(--bad); }
  .pf-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
  @media (max-width: 960px) { .pf-grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .card h3 { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  table.pl td { padding: 6px 4px; border-bottom: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
  table.pl td.n { text-align: right; white-space: nowrap; }
  table.pl td.p { text-align: right; color: var(--muted); font-size: 12px; width: 64px; }
  table.pl tr.sec td { font-weight: 600; padding-top: 14px; border-bottom: 1px solid var(--line); }
  table.pl tr.grp { cursor: pointer; }
  table.pl tr.grp:hover td { background: var(--panel-2); }
  table.pl tr.grp td:first-child::before { content: "›"; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
  table.pl tr.grp.open td:first-child::before { transform: rotate(90deg); }
  table.pl tr.part td { font-size: 12.5px; color: var(--muted); padding-left: 22px; }
  table.pl tr.part.has { cursor: pointer; }
  table.pl tr.det td { font-size: 12px; color: var(--muted); padding-left: 40px; border-bottom: 0; padding-top: 2px; padding-bottom: 2px; }
  table.pl tr.tot td { font-weight: 600; border-top: 1px solid var(--line); }
  table.pl tr.profit td { font-weight: 600; font-size: 16px; border-top: 2px solid var(--ink); border-bottom: 0; padding-top: 10px; }
  .chart { width: 100%; height: 220px; display: block; }
  .chart .bar.pos { fill: var(--ok); } .chart .bar.neg { fill: var(--bad); }
  .chart .bar:hover { opacity: .75; }
  .chart .axis { stroke: var(--muted); stroke-opacity: .5; } .chart .grid { stroke: var(--line); stroke-dasharray: 2 3; } .chart text { fill: var(--muted); font-size: 10px; font-family: var(--sans); }
  .tip { font-size: 12.5px; color: var(--muted); min-height: 18px; margin-top: 4px; }
  .cov { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .cov b { color: var(--ink); font-weight: 600; }
  .cov .warn { color: var(--bad); }
  .unc { margin: 6px 0 0; padding-left: 16px; }
  .loading { opacity: .5; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="brand">Myrddin Hub</h1>
    </div>
    <div class="who">
      <span id="whoami" class="muted"></span>
      <button id="menuBtn" class="btn ghost">Menu ▾</button>
      <div id="menu" class="menu hidden">
        <button data-go="/#activity">Activity log</button>
        <button data-go="/#connect">Connect Claude</button>
        <button data-go="/#users" class="owner-only hidden">Users &amp; logins</button>
        <hr>
        <button data-act="logout">Sign out</button>
      </div>
    </div>
  </header>
  <nav class="tabs"><a href="/tasks" data-tab="tasks">Inbox</a><a href="/leads" data-tab="leads">Leads</a><a href="/" data-tab="orders">Orders</a><a href="/stores" data-tab="stores">Stores &amp; brands</a><a href="/inventory-health" data-tab="inventory_health">Inventory health</a><a href="/brand-sellers" data-tab="brand_sellers">Sephora brands</a><a href="/timeclock" data-tab="timeclock">Time clock</a><a href="/reimbursements" data-tab="reimbursements">Reimbursements</a><a href="/profit" data-tab="profit" class="on">Profit</a><a href="/commissions" data-tab="commissions">Commissions</a></nav>

  <div class="pf-head"><h2>Profit</h2><span class="muted" id="meta" style="font-size:13px"></span><span class="sp"></span>
    <div class="chips" id="presets">
      <button class="chip" data-p="today">Today</button><button class="chip" data-p="yesterday">Yesterday</button>
      <button class="chip" data-p="7d">Last 7 days</button><button class="chip on" data-p="mtd">This month</button>
      <button class="chip" data-p="lm">Last month</button><button class="chip" data-p="ytd">This year</button>
    </div>
    <div class="pf-range"><input type="date" id="from" aria-label="From"><span class="muted">–</span><input type="date" id="to" aria-label="To"></div>
    <label class="pf-toggle" title="A flat prep cost for every unit sent to Amazon, on the shipment plan's date"><input type="checkbox" id="prepOn"> Prep <span id="prepRate">$0.75</span>/unit</label>
    <label class="pf-toggle" title="Expense units missing from closed inbound shipments (Reimbursements page numbers), on the day the shipment plan closed"><input type="checkbox" id="inbOn"> Missing inbound</label>
    <label class="pf-toggle" title="Leave out Amazon.com.mx and Amazon.ca, to compare with QuickBooks' (US) accounts"><input type="checkbox" id="usOnly"> US only</label>
  </div>
  <div class="stats" id="stats"></div>
  <div class="pf-grid" id="body">
    <div class="card"><h3>Profit &amp; loss · Amazon</h3><table class="pl" id="pl"></table></div>
    <div>
      <div class="card"><h3 id="chartTitle">Profit by day</h3><svg class="chart" id="chart" role="img" aria-label="Profit by day"></svg><div class="tip" id="tip">Hover a bar for that day.</div></div>
      <div class="card" style="margin-top:16px"><h3>About these numbers</h3><div class="cov" id="cov"></div></div>
    </div>
  </div>
</div>
<div id="toasts" class="toasts"></div>
<script src="/static/viewas.js"></script>
<script src="/static/clock.js"></script>
<script src="/static/bonus.js"></script>
<script src="/static/common.js"></script>
<script>
(() => {
  const { $, $$, esc, money, num, api, fail } = LG;
  const m0 = (n) => money(n, 0);
  const iso = (d) => d.toISOString().slice(0, 10);
  // Amazon's day is Pacific time; "today" follows that.
  const ptToday = () => { const s = new Date().toLocaleString('en-CA', { timeZone: 'America/Los_Angeles' }).slice(0, 10); return new Date(s + 'T12:00:00Z'); };
  const addDays = (d, n) => { const x = new Date(d); x.setUTCDate(x.getUTCDate() + n); return x; };
  function preset(p) {
    const t = ptToday();
    if (p === 'today') return [t, t];
    if (p === 'yesterday') return [addDays(t, -1), addDays(t, -1)];
    if (p === '7d') return [addDays(t, -6), t];
    if (p === 'mtd') return [new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), 1, 12)), t];
    if (p === 'lm') { const a = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() - 1, 1, 12)); const b = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), 0, 12)); return [a, b]; }
    if (p === 'ytd') return [new Date(Date.UTC(t.getUTCFullYear(), 0, 1, 12)), t];
  }
  const st = { a: null, b: null, us: false, inb: true, prep: true, data: null, open: new Set() };
  try { st.us = localStorage.getItem('pf_us') === '1'; st.inb = localStorage.getItem('pf_inb') !== '0'; st.prep = localStorage.getItem('pf_prep') !== '0'; } catch { /* storage off */ }
  $('#prepOn').checked = st.prep;
  $('#usOnly').checked = st.us;
  $('#inbOn').checked = st.inb;

  function setRange(a, b, p) {
    st.a = iso(a); st.b = iso(b); $('#from').value = st.a; $('#to').value = st.b;
    $$('#presets .chip').forEach((c) => c.classList.toggle('on', c.dataset.p === p));
    load();
  }

  async function load() {
    $('#body').classList.add('loading');
    try {
      st.data = await api('GET', `/api/profit?start=${st.a}&end=${st.b}&us=${st.us ? 1 : 0}&inbound=${st.inb ? 1 : 0}&prep=${st.prep ? 1 : 0}`);
      render();
    } catch (e) { fail(e); } finally { $('#body').classList.remove('loading'); }
  }

  const ACCT = { chase_2598: 'Chase …2598', chase_8038: 'Chase …8038', amex_1000: 'Amex …1000', chase_5050: 'Chase checking' };
  function bankThrough(c) {
    if (!c) return '';
    const parts = Object.entries(ACCT).filter(([k]) => c[k]).map(([k, n]) => {
      const d = [c[k].statement, c[k].quickbooks].filter(Boolean).sort().pop();
      return `${n} through ${LG.fmtDate(d)}`;
    });
    return parts.length ? `Bank data is loaded ${parts.join(', ')}, so the last few weeks can be missing charges until the next statement arrives.` : '';
  }
  const pctOf = (v, base) => base ? (v / base * 100).toFixed(1) + '%' : '';

  function render() {
    const d = st.data, T = d.totals, cov = d.coverage;
    const fees = T.expense;
    $('#stats').innerHTML = [
      ['Sales', m0(T.sales), `${num(cov.units)} units shipped`],
      ['Amazon income', m0(T.income), 'after refunds, promos, reimbursements'],
      ['Product cost', m0(-T.cogs), 'COGS + inbound shipping'],
      ['Amazon fees', m0(-fees), pctOf(-fees, T.sales) + ' of sales'],
      ['Profit', m0(T.profit), T.margin != null ? pctOf(T.profit, T.sales) + ' of sales' : '', true],
    ].map(([k, v, sub, big]) => `<div class="stat ${big ? 'big' : ''}"><div class="k">${k}</div><div class="v ${big ? (T.profit >= 0 ? 'pos' : 'neg') : ''}">${v}</div><div class="sub">${esc(sub)}</div></div>`).join('');

    const rows = [];
    const secName = { income: 'Income', cogs: 'Cost of goods sold', expense: 'Amazon expenses', opex: 'Business expenses', other: 'Other income' };
    const totName = { income: 'Total income', cogs: 'Total cost of goods sold', expense: 'Total Amazon expenses', opex: 'Total business expenses', other: 'Total other income' };
    const secTot = { income: T.income, cogs: T.cogs, expense: T.expense, opex: T.opex || 0, other: T.other || 0 };
    const profRow = (label, v) => `<tr class="profit"><td>${label}</td><td class="n">${money(v)}</td><td class="p">${pctOf(v, T.sales)}</td></tr>`;
    let last = null;
    d.groups.forEach((g, gi) => {
      if (g.section !== last) {
        if (last) rows.push(`<tr class="tot"><td>${totName[last]}</td><td class="n">${money(secTot[last])}</td><td class="p">${pctOf(secTot[last], T.sales)}</td></tr>`);
        if (last === 'cogs') rows.push(`<tr class="tot"><td>Gross profit</td><td class="n">${money(T.income + T.cogs)}</td><td class="p">${pctOf(T.income + T.cogs, T.sales)}</td></tr>`);
        if (last === 'expense') rows.push(profRow('Amazon profit', T.amazon_profit));
        if (last === 'opex') rows.push(profRow('Operating profit', T.operating_profit));
        rows.push(`<tr class="sec"><td colspan="3">${secName[g.section]}</td></tr>`); last = g.section;
      }
      const open = st.open.has('g' + gi);
      rows.push(`<tr class="grp ${open ? 'open' : ''}" data-k="g${gi}"><td>${esc(g.name)}</td><td class="n">${money(g.amount)}</td><td class="p">${pctOf(g.amount, T.sales)}</td></tr>`);
      if (open) g.parts.forEach((p, pi) => {
        const k = `p${gi}_${pi}`, po = st.open.has(k);
        rows.push(`<tr class="part ${p.detail.length ? 'has' : ''}" data-k="${k}"><td>${esc(p.line === 'COGS' ? 'Units shipped × InventoryLab unit cost' : p.line)}</td><td class="n">${money(p.amount)}</td><td class="p"></td></tr>`);
        if (po) p.detail.forEach((x) => rows.push(`<tr class="det"><td>${esc(x.what)}</td><td class="n">${money(x.amount)}</td><td class="p"></td></tr>`));
      });
    });
    if (last) rows.push(`<tr class="tot"><td>${totName[last]}</td><td class="n">${money(secTot[last])}</td><td class="p">${pctOf(secTot[last], T.sales)}</td></tr>`);
    rows.push(profRow(last === 'expense' ? 'Amazon profit' : 'Profit', T.profit));
    $('#pl').innerHTML = rows.join('');

    chart(series(d.daily));

    const cs = cov.cost_snapshot ? LG.fmtDate(cov.cost_snapshot) : 'none yet';
    const unc = cov.uncosted_units;
    const fx = Object.entries(cov.other_currency || {}).map(([c, v]) => `${c} ${num(Math.round(v))}`).join(', ');
    $('#cov').innerHTML = `
      <div>Amazon transactions by <b>posted date, Pacific time</b> — the same transactions Link My Books books into QuickBooks. ${cov.days_loaded} of ${cov.days} days loaded${cov.days_loaded < cov.days ? ' <span class="warn">(history still loading)</span>' : ''}; last pulled ${cov.newest_pull ? new Date(cov.newest_pull).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—'}. The last two days can still grow as Amazon posts late orders.</div>
      <div style="margin-top:6px">Product cost: <b>${num(cov.costed_inventorylab)}</b> units at InventoryLab cost (its monthly SKU cost, or the latest daily snapshot: ${esc(cs)})${cov.costed_ledger ? `, <b>${num(cov.costed_ledger)}</b> at the order ledger's average cost` : ''}${unc ? `, <span class="warn"><b>${num(unc)}</b> units with no cost</span> (not in the profit above)` : ''}.</div>
      ${unc ? `<ul class="unc">${cov.uncosted.slice(0, 8).map((u) => `<li>${esc(u.sku)}${u.asin ? ` · <a href="https://www.amazon.com/dp/${esc(u.asin)}" target="_blank" rel="noopener">${esc(u.asin)}</a>` : ''} — ${num(u.units)} units</li>`).join('')}</ul>` : ''}
      ${fx && !d.us_only ? `<div style="margin-top:6px">Includes Amazon Mexico/Canada activity (${esc(fx)}) converted at the day's ECB rate. Tick “US only” to compare with QuickBooks' US accounts.</div>` : ''}
      <div style="margin-top:6px">Inventory written off: units Amazon lost (net of units found again) or damaged in its warehouses, from Amazon's inventory ledger${cov.writeoff_through ? ' (through ' + esc(LG.fmtDate(cov.writeoff_through)) + ')' : ''}, at InventoryLab cost${cov.writeoff_uncosted ? ` — <span class="warn">${num(cov.writeoff_uncosted)} units with no cost</span>` : ''}. ${cov.inbound_included ? `Missing inbound is included: <b>${num(cov.inbound_units)}</b> units from shipment plans that closed in this range, using the Reimbursements page's counts (Seller Central's where the Hub has them), dated the day the plan's last shipment closed.` : 'Missing inbound is switched off (tick “Missing inbound” to include it).'} Reimbursements for any of these units show as income when Amazon pays them.</div>
      <div style="margin-top:6px">${cov.prep_included ? `Prep: <b>${num(cov.prep_units)}</b> units sent to Amazon in this range × ${money(cov.prep_rate)}, on each shipment plan's date. It's an estimate standing in for your prep-center bills; switch it off once bank costs are on this page, or prep will count twice.` : 'Prep is switched off (tick “Prep” to include an estimate per unit sent to Amazon).'}</div>
      <div style="margin-top:6px">Cash back: Chase Premier statement credits and the Amex early-pay discount, as QuickBooks books them (Cash Back / Bank &amp; Credit Card Rewards), on the day each credit posted${cov.other_loaded ? `; loaded from QuickBooks ${new Date(cov.other_loaded).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}` : ' <span class="warn">(not loaded yet)</span>'}. It arrives once a month per card, so a partial month may not have it yet.</div>
      <div style="margin-top:6px">Contractors: Ariane's Wise payments and Leen's RealTime ACH payments out of Chase checking, on the bank date, from the Hub's stored bank transactions (QuickBooks names the payee)${cov.contractor_payments ? ` — ${num(cov.contractor_payments)} payments in this range${cov.contractor_pending ? `, ${num(cov.contractor_pending)} still waiting for review in QuickBooks` : ''}` : ''}.</div>
      <div style="margin-top:6px">Software, insurance &amp; Pirate Ship: charges from the merchants your bookkeeper files under Software &amp; Apps and Business Insurance in QuickBooks (Seller Snap, Keepa, Airtable, InventoryLab, QuickBooks, Adobe, Anthropic, OpenAI, The Hartford…), plus Pirate Ship postage, Tall Oak, the registered agent, memberships (Experian, Costco, Amazon Business Prime, Amex annual fee) and bank &amp; card fees,, found in your card statements and bank transactions, on the transaction date${cov.recurring_payments ? ` — ${num(cov.recurring_payments)} charges in this range` : ''}. ${bankThrough(cov.bank_through)}</div>
      <div style="margin-top:6px">Not included yet: other bank and card costs (prep-center bills, payroll, supplies).</div>`;
    $('#meta').textContent = `${LG.fmtDate(d.start)} – ${LG.fmtDate(d.end)}`;
    if (cov.prep_rate != null) $('#prepRate').textContent = money(cov.prep_rate);
  }

  // Ranges longer than two months (e.g. "This year") are shown by month (Nick, Nov 8 2026).
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function series(daily) {
    const monthly = daily.length > 62;
    $('#chartTitle').textContent = monthly ? 'Profit by month' : 'Profit by day';
    $('#chart').setAttribute('aria-label', monthly ? 'Profit by month' : 'Profit by day');
    $('#tip').textContent = monthly ? 'Hover a bar for that month.' : 'Hover a bar for that day.';
    if (!monthly) return daily.map((x) => ({ ...x, label: LG.fmtDate(x.day).replace(/, \d{4}$/, ''), full: LG.fmtDate(x.day) }));
    const by = new Map();
    daily.forEach((x) => {
      const k = x.day.slice(0, 7);
      const m = by.get(k) || { day: k, profit: 0, sales: 0, units: 0, n: 0 };
      m.profit += x.profit; m.sales += x.sales; m.units += x.units; m.n += 1; by.set(k, m);
    });
    return [...by.values()].map((m) => {
      const [y, mo] = m.day.split('-').map(Number);
      const partial = m.n < new Date(y, mo, 0).getDate();
      return { ...m, label: MON[mo - 1], full: `${MON[mo - 1]} ${y}${partial ? ` (${m.n} days)` : ''}` };
    });
  }

  // Round-number scale (Nick, Nov 8 2026): the smallest step from this list that gives at most 10 gridlines,
  // e.g. $2,500 or $5,000 for months, $250 or $500 for days.
  const STEPS = [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000];
  function scale(vals) {
    const hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
    let step = STEPS[STEPS.length - 1];
    for (const st of STEPS) { if (Math.ceil(hi / st) - Math.floor(lo / st) <= 10) { step = st; break; } }
    const top = Math.max(step, Math.ceil(hi / step) * step), bot = Math.floor(lo / step) * step;
    const ticks = []; for (let v = bot; v <= top + 1e-6; v += step) ticks.push(v);
    return { top, bot, ticks };
  }
  const tick$ = (v) => (v < 0 ? '-' : '') + '$' + (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toLocaleString('en-US', { maximumFractionDigits: 2 }) + 'k' : Math.abs(v).toLocaleString('en-US'));

  function chart(days) {
    const svg = $('#chart'); const W = svg.clientWidth || 500, H = 220, padL = 46, padB = 22, padT = 8;
    const sc = scale(days.map((x) => x.profit)); const mx = sc.top, mn = sc.bot;
    const span = (mx - mn) || 1; const y = (v) => padT + (mx - v) / span * (H - padT - padB);
    const bw = (W - padL - 6) / Math.max(days.length, 1);
    let s = sc.ticks.map((v) => `<line class="${v === 0 ? 'axis' : 'grid'}" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/>`).join('');
    s += sc.ticks.map((v) => `<text x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${tick$(v)}</text>`).join('');
    days.forEach((x, i) => {
      const x0 = padL + i * bw + bw * .12, w = Math.max(1, bw * .76), y0 = y(Math.max(0, x.profit)), h = Math.max(1, Math.abs(y(x.profit) - y(0)));
      s += `<rect class="bar ${x.profit >= 0 ? 'pos' : 'neg'}" x="${x0}" y="${y0}" width="${w}" height="${h}" rx="1.5" data-i="${i}"><title>${esc(x.full)}: ${m0(x.profit)}</title></rect>`;
    });
    const every = days.length <= 14 ? 1 : Math.ceil(days.length / 8);
    days.forEach((x, i) => { if (i % every === 0) s += `<text x="${padL + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(x.label)}</text>`; });
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = s;
    svg.onmousemove = (e) => { const r = e.target.closest('rect'); if (!r) return; const x = days[+r.dataset.i];
      $('#tip').textContent = `${x.full} · profit ${money(x.profit)} · sales ${money(x.sales)} · ${num(x.units)} units`; };
  }

  $('#pl').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-k]'); if (!tr) return;
    const k = tr.dataset.k; st.open.has(k) ? st.open.delete(k) : st.open.add(k); render();
  });
  $('#presets').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (!c) return; const [a, b] = preset(c.dataset.p); setRange(a, b, c.dataset.p); });
  const custom = () => { if ($('#from').value && $('#to').value) setRange(new Date($('#from').value + 'T12:00:00Z'), new Date($('#to').value + 'T12:00:00Z'), null); };
  $('#from').addEventListener('change', custom); $('#to').addEventListener('change', custom);
  $('#prepOn').addEventListener('change', () => { st.prep = $('#prepOn').checked; try { localStorage.setItem('pf_prep', st.prep ? '1' : '0'); } catch { /* ignore */ } load(); });
  $('#inbOn').addEventListener('change', () => { st.inb = $('#inbOn').checked; try { localStorage.setItem('pf_inb', st.inb ? '1' : '0'); } catch { /* ignore */ } load(); });
  $('#usOnly').addEventListener('change', () => { st.us = $('#usOnly').checked; try { localStorage.setItem('pf_us', st.us ? '1' : '0'); } catch { /* ignore */ } load(); });
  window.addEventListener('resize', () => st.data && chart(series(st.data.daily)));

  LG.header().then(() => { const [a, b] = preset('mtd'); setRange(a, b, 'mtd'); }).catch(fail);
})();
</script>
