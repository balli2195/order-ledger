<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead DB · Myrddin Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441c'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23fff8f2' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<style>
  .sl-title { margin: 22px 0 2px; font-size: 18px; font-weight: 600; }
  .sl-sub { margin: 0; color: var(--muted); font-size: 13px; }
  .sl-sale { margin-top: 12px; padding: 10px 14px; border-radius: 9px; font-size: 13.5px;
    border: 1px solid color-mix(in srgb, var(--ok) 40%, var(--line)); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); }
  .sl-sale b.code { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
  .sl-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .sl-stats .stat { min-width: 120px; }
  .sl-day { margin: 22px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sl-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; transition: opacity .3s; }
  .sl-card.busy { opacity: .5; pointer-events: none; }
  .sl-brand { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .sl-name { font-weight: 600; }
  .sl-shade { color: var(--muted); }
  .sl-amz { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .sl-figs { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; font-size: 13px; }
  .sl-figs .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; display: block; }
  .sl-figs .v { font-variant-numeric: tabular-nums; font-weight: 500; }
  .sl-figs .v.big { font-size: 16px; font-weight: 600; }
  .sl-figs .v.good { color: var(--ok); } .sl-figs .v.badv { color: var(--bad); }
  .sl-strike { text-decoration: line-through; color: var(--muted); font-weight: 400; margin-right: 4px; }
  .sl-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .sl-tag { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--line-2); color: var(--ink); white-space: nowrap; }
  .sl-tag.warn { background: var(--warn-soft); color: var(--bad); font-weight: 600; }
  .sl-tag.good { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); font-weight: 600; }
  .sl-tag.reason { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sl-links { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; margin-top: 8px; }
  .sl-note { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .sl-acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 150px; max-width: 330px; }
  .sl-acts .btn { white-space: nowrap; }
  .sl-size { display: flex; gap: 4px; }
  .sl-size .btn { flex: 1; padding: 4px 6px; font-size: 12.5px; }
  .sl-size .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .sl-rejbox { display: flex; flex-direction: column; gap: 5px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--line-2); }
  .sl-rejq { display: flex; flex-wrap: wrap; gap: 4px; }
  .sl-rejq .btn { padding: 2px 8px; font-size: 12px; white-space: nowrap; }
  .sl-rejq .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .sl-why { font-size: 11.5px; color: var(--bad); margin-top: 3px; max-width: 180px; white-space: normal; }
  .sl-rej { display: flex; gap: 4px; }
  .sl-rej input { min-width: 0; padding: 4px 7px; font-size: 13px; }
  .sl-done { grid-column: 1 / -1; font-size: 13px; }
  .sl-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .sl-seg button { border: 0; background: transparent; padding: 6px 14px; font-size: 13.5px; cursor: pointer; color: var(--ink); }
  .sl-seg button.on { background: var(--accent); color: var(--accent-ink); }
  .sl-filters select { width: auto; padding: 5px 7px; }
  .brand-pop { position: absolute; z-index: 45; width: 300px; max-height: 380px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 36px rgba(20,16,10,.18); overflow: hidden; }
  .brand-pop input { margin: 8px; width: calc(100% - 16px); }
  .brand-pop ul { list-style: none; margin: 0; padding: 0 0 6px; overflow: auto; }
  .brand-pop li { padding: 6px 12px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .brand-pop li:hover, .brand-pop li.on { background: var(--accent-soft); color: var(--accent); }
  .brand-pop li .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sl-brands { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 12px; }
  .sl-brands[hidden], #fStore[hidden], #qSale[hidden] { display: none; }
  .sl-brands button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 1px 9px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .sl-brands button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .sl-brands button .n { color: var(--muted); margin-left: 3px; font-variant-numeric: tabular-nums; }
  #catTable td { vertical-align: top; font-size: 13px; }
  #catTable tbody tr { cursor: default; }
  #qTable .prod { min-width: 200px; max-width: 300px; white-space: normal; }
  #qTable td { vertical-align: top; }
  #catTable .prod { min-width: 220px; max-width: 320px; white-space: normal; }
  #catTable .mk { white-space: nowrap; }
  #catTable .mk .btn { padding: 2px 7px; font-size: 12px; }
  #catTable .mk .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .sl-more { margin: 12px 0; text-align: center; }
  @media (max-width: 760px) {
    .sl-card { grid-template-columns: 1fr; }
    .sl-acts { flex-direction: row; flex-wrap: wrap; min-width: 0; }
    .sl-acts > * { flex: 1 1 140px; }
    .sl-stats .stat { min-width: 0; flex: 1 1 40%; }
  }
</style>
</head>
<body>
<div class="wrap full">
  <header class="top">
    <div>
      <h1 class="brand">Myrddin Hub</h1>
    </div>
    <div class="who">
      <span id="whoami" class="muted"></span>
      <button id="menuBtn" class="btn ghost">Menu ▾</button>
      <div id="menu" class="menu hidden">
        <button data-go="/#activity">Activity log</button>
        <button data-go="/#connect">Connect Claude</button>
        <button data-go="/#users" class="owner-only hidden">Users &amp; logins</button>
        <hr>
        <button data-act="logout">Sign out</button>
      </div>
    </div>
  </header>
  <nav class="tabs"><a href="/tasks" data-tab="tasks">Inbox</a><a href="/leads" data-tab="leads">Leads</a><a href="/" data-tab="orders">Orders</a><a href="/lead-db" data-tab="sephora_leads" class="on">Lead DB</a><a href="/repricer" data-tab="repricer">Repricer</a><a href="/inventory-health" data-tab="inventory_health">Inventory health</a><a href="/timeclock" data-tab="timeclock">Time clock</a><a href="/reimbursements" data-tab="reimbursements">Reimbursements</a><a href="/profit" data-tab="profit">Profit</a><a href="/commissions" data-tab="commissions">Commissions</a></nav>

  <h2 class="sl-title">Lead DB <span class="live-dot" id="live" title="Live updates. Click for the last job runs." role="button" tabindex="0" style="cursor:pointer"></span></h2>
  <div id="sale" class="sl-sale hidden"></div>

  <div class="search" id="searchBox"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search brand, product, shade or ASIN…" autocomplete="off"></div>
  <div class="toolbar">
    <div class="sl-seg" id="viewSeg"><button data-v="queue" class="on">To review</button><button data-v="decided">Decided</button><button data-v="catalog">Catalog</button></div>
    <a class="btn small ghost" href="/lead-db/guide" title="How the Lead DB tables, jobs and model training work">How it works</a>
    <span class="muted" id="count" style="font-size:13px"></span>
    <select id="fStore" hidden><option value="">All stores</option></select>
    <span id="sSlot" style="margin-left:auto;display:flex;flex:0 1 380px;min-width:240px"></span>
  </div>

  <section id="queueView">
    <div id="queue"></div>
    <div id="queueEmpty" class="empty hidden">Nothing to review right now.</div>
  </section>

  <section id="catalogView" hidden>
    <div class="sl-brands" id="brands" hidden></div>
    <div class="table-wrap"><table id="catTable">
      <thead><tr><th id="thBrand" class="sortable" title="Click to filter by brand">Brand ▾</th><th>Product</th><th>Amazon</th><th class="num">Sephora</th><th id="thSale" class="sortable" title="Sephora's own sale price on the product (not promo codes). Click to filter.">On sale ▾</th><th class="num">Buy Box</th><th id="thSell" class="sortable" title="Whether Amazon lets you sell this listing (monthly restriction check). Restricted listings are hidden unless picked here.">Sellable ▾</th><th id="thConf" class="sortable" title="How sure the matcher is. Click to filter.">Confidence ▾</th><th class="num sortable" id="thRoi" data-roi="roi" title="ROI at today's Sephora price and Buy Box. Click to sort or filter.">ROI now ▾</th><th class="num sortable" data-sort="sold" title="Click to sort: high first, then low first, then back to brand">Sold/mo</th><th>Flags</th><th id="thChecked" class="sortable" title="Who last marked the pair OK or wrong, and when. Click to filter or sort.">Last checked ▾</th><th id="thMatch" class="sortable" title="Wrong matches are hidden unless picked here. On a wrong row, OK makes it a match again; clicking Wrong again clears the mark.">Match ▾</th></tr></thead>
      <tbody id="catRows"></tbody></table>
      <div id="catEmpty" class="empty hidden">No catalog rows match.</div>
    </div>
    <div class="sl-more"><button id="catMore" class="btn small" hidden>Show more</button></div>
  </section>
</div>
<div id="toasts" class="toasts"></div>
<script src="/static/viewas.js"></script>
<script src="/static/clock.js"></script>
<script src="/static/bonus.js"></script>
<script src="/static/common.js"></script>
<script src="/static/wrongmatch.js"></script>
<script>
(async () => {
  const { $, $$, esc, num, money, pct, fmtDate, api, toast, fail } = LG;
  const REJ_QUICK = ['ROI too low', 'Historical price too low', 'Too many sellers', "Can't sell / gated", 'Not in stock at Sephora'];
  const S = { view: 'queue', cands: [], decided: [], cat: { rows: [], total: 0, brands: [] }, brand: '', sort: '', conf: '', sale: '', match: '', sell: '', by: '', days: '', minRoi: '', minRoi90: '', ov: null, size: {}, rejecting: null };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* ignore */ } } };
  const safeUrl = (u) => u && /^https?:\/\//i.test(u) ? u : null;
  const link = (u, t) => safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>` : '';
  // the store size this ASIN matches (Nick, Nov 17, 2026): link to that size's SKU and show its own price, not the range
  const storeUrl = (r) => {
    if (!safeUrl(r.sephora_url) || !r.store_sku_id) return r.sephora_url;
    try { const u = new URL(r.sephora_url); u.searchParams.set('skuId', r.store_sku_id); return u.toString(); } catch (e) { return r.sephora_url; }
  };
  // leads rejected as not in stock are watched by the morning Chrome check (Nick, Nov 17, 2026)
  const stockLine = (c) => c.stock_watch === 'restocked'
    ? ` · <span class="sl-tag good">Back in stock ${esc(when(c.stock_restocked_at))}</span>`
    : c.stock_watch === 'watching' ? ` · <span class="sl-tag">Watching Sephora stock${c.stock_checked_at ? ` · checked ${esc(when(c.stock_checked_at))}` : ''}</span>` : '';
  const listPrice = (r) => r.store_size_price != null
    ? `${money(r.store_size_price)}${r.store_size ? ` <span class="muted" style="font-size:11.5px">(${esc(r.store_size)})</span>` : ''}`
    : (r.price_lo != null && r.price_hi != null && Number(r.price_lo) !== Number(r.price_hi) ? `${money(r.price_lo)}–${money(r.price_hi)}` : money(r.price_hi ?? r.price_lo));
  const amzUrl = (a) => `https://www.amazon.com/dp/${encodeURIComponent(a)}`;
  const keepaUrl = (a) => `https://keepa.com/#!product/1-${encodeURIComponent(a)}`;
  const REASON = { price_watch: 'Price drop', sale: 'Sale', new_product: 'New product' };
  const SELL = { open: 'Open', approval_required: 'Approval required', restricted: 'Restricted' };
  const SIZE = { lo: 'Mini / smaller', hi: 'Full size' };
  const when = (iso) => iso ? new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  const roiCls = (v) => v == null ? '' : v >= 0.3 ? 'good' : v < 0.15 ? 'badv' : '';
  const editor = () => LG.can('editor') && !LG.st.me?.viewed_by;
  const multiStore = () => (S.stores || []).length > 1;

  // ---------------------------------------------------------------- header: runs, sale, counts
  function renderOverview() {
    const o = S.ov; if (!o) return;
    // the "Last checked" line moved into a dialog opened from the green dot (Nick, Nov 20 2026): see openRuns()
    const s = o.sale;
    $('#sale').classList.toggle('hidden', !s);
    if (s) $('#sale').innerHTML = `<b>Sephora sale on:</b> ${esc(s.text || '')}${s.code ? ` · code <b class="code">${esc(s.code)}</b>` : ''}${s.ends ? ` · ends ${esc(fmtDate(s.ends))}` : ''} <span class="muted">(checked ${esc(when(s.checked_at))})</span>`;
    // the stat cards (To review, Approved, Rejected, Catalog pairs, Matches to check, Sizes to set) were removed (Nick, Nov 20 2026)
  }

  function openRuns() {
    const runs = (S.ov && S.ov.runs) || [];
    const fmt = (v) => typeof v === 'number' ? num(v) : esc(String(v));
    const rows = runs.map((r) => `<tr><td style="white-space:nowrap"><b>${esc(String(r.kind || '').replace(/_/g, ' '))}</b></td><td style="white-space:nowrap">${esc(when(r.at))}</td>
      <td>${Object.entries(r.counts || {}).map(([k, v]) => `${fmt(v)} ${esc(k.replace(/_/g, ' '))}`).join(' · ')}</td></tr>`).join('');
    const scrim = document.createElement('div'); scrim.className = 'scrim';
    const dlg = document.createElement('div'); dlg.className = 'drawer narrow'; dlg.setAttribute('role', 'dialog'); dlg.setAttribute('aria-modal', 'true');
    dlg.innerHTML = `<div class="drawer-head"><h2>Last job runs</h2><button class="btn small" data-close>Close</button></div>
      <div class="drawer-body">${rows ? `<table><thead><tr><th>Job</th><th>Ran</th><th>Results</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="muted">The Sephora jobs haven\'t run yet.</p>'}</div>`;
    const close = () => { scrim.remove(); dlg.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    scrim.addEventListener('click', close); dlg.querySelector('[data-close]').addEventListener('click', close); document.addEventListener('keydown', onKey);
    document.body.append(scrim, dlg);
  }
  $('#live').addEventListener('click', openRuns);
  $('#live').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openRuns(); } });

  // ---------------------------------------------------------------- queue
  function matches(c, q) {
    return !q || [c.brand, c.sephora_name, c.shade, c.asin, c.amazon_title, c.product_id].some((v) => String(v || '').toLowerCase().includes(q));
  }
  function warnings(c) {
    const w = [];
    const sz = c.size_confirmed || S.size[c.id];
    if (c.needs_size && !sz) w.push(['warn', 'Needs size']);
    if (c.needs_size && sz) w.push(['', 'Size: ' + SIZE[sz]]);
    if (c.sellable === 'approval_required') w.push(['warn', 'Approval required']);
    if (c.sellable === 'restricted') w.push(['warn', 'Restricted']);
    if (c.amazon_on) w.push(['warn', 'Amazon on listing']);
    if (c.confidence === 'low') w.push(['warn', 'Low-confidence match']);
    if (c.catalog_active === false) w.push(['warn', 'Catalog row inactive']);
    return w;
  }
  // To review / Decided as a table like the Catalog (Nick, Nov 20 2026; was cards grouped by day). Filters and sorts
  // are on the column titles and work on the loaded rows.
  function qActs(c) {
    const sz = c.size_confirmed || S.size[c.id] || '';
    if (c.status !== 'new') {
      return c.status === 'approved'
        ? `<span class="sl-tag good">Approved</span><div class="muted" style="font-size:11px">${esc(c.decided_by || '')} ${esc(when(c.decided_at))}</div>${c.lead_id ? `<a href="/leads#lead=${esc(c.lead_id)}" style="font-size:12px">open lead</a>` : ''}${c.lead_qty_ordered != null ? `<div class="muted" style="font-size:11px">ordered ${num(c.lead_qty_ordered)}</div>` : ''}`
        : `<span class="sl-tag ${c.status === 'rejected' ? 'warn' : ''}">${esc(c.status[0].toUpperCase() + c.status.slice(1))}</span>${c.decided_by ? `<div class="muted" style="font-size:11px">${esc(c.decided_by)} ${esc(when(c.decided_at))}</div>` : ''}${c.reject_reason || c.expired_reason ? `<div class="sl-why">${esc(c.reject_reason || c.expired_reason)}</div>` : ''}${stockLine(c)}`;
    }
    if (!editor()) return '';
    const size = c.needs_size ? `<div class="sl-size" title="Sephora sells two sizes; which one matches the Amazon listing?">
        <button class="btn small ${sz === 'lo' ? 'on' : ''}" data-size="lo" data-id="${esc(c.id)}">Mini</button>
        <button class="btn small ${sz === 'hi' ? 'on' : ''}" data-size="hi" data-id="${esc(c.id)}">Full</button></div>` : '';
    const rej = S.rejecting === c.id
      ? `<div class="sl-rejbox"><div class="sl-rejq">${REJ_QUICK.map((q) => `<button type="button" class="btn small" data-rq="${esc(q)}">${esc(q)}</button>`).join('')}</div>
          <div class="sl-rej"><input id="rejReason" placeholder="Why? (optional)" maxlength="300"><button class="btn small danger" data-act="reject-go" data-id="${esc(c.id)}">Reject</button></div>
          <button type="button" class="btn small ghost" data-act="reject-cancel">Cancel</button></div>`
      : `<button class="btn small" data-act="reject" data-id="${esc(c.id)}">Reject</button>`;
    return `<div class="sl-acts" style="min-width:130px">${size}
      <button class="btn primary small" data-act="approve" data-id="${esc(c.id)}" ${c.needs_size && !sz ? 'disabled title="Pick the size first"' : ''}>Approve → lead</button>
      ${rej}
      <button class="btn small ghost danger" data-act="wrong" data-id="${esc(c.id)}" title="This Sephora product isn't the Amazon listing; it won't be suggested again">Wrong match</button></div>`;
  }
  function qRow(c) {
    const list = listPrice(c);
    const sephora = c.on_sale && c.sale_price != null ? `<span class="sl-strike">${list}</span>${money(c.sale_price)}` : list;
    const notes = [];
    if (c.amazon_on) notes.push('<span class="sl-tag warn">Amazon on listing</span>');
    if (c.match_ok === true) notes.push('<span class="sl-tag good">Match OK</span>');
    if (c.rechecked_at && c.status === 'new') notes.push(`<span class="sl-tag">Re-priced ${esc(when(c.rechecked_at))}</span>`);
    const txt = [c.price_basis, c.note].filter(Boolean).join(' · ');
    return `<tr data-card="${esc(c.id)}">
      <td style="white-space:nowrap">${esc(fmtDate(c.found_on))}</td>
      <td>${esc(c.brand || '—')}${multiStore() || (c.store && c.store !== 'Sephora') ? `<div class="muted" style="font-size:11px">${esc(c.store)}</div>` : ''}</td>
      <td class="prod">${link(storeUrl(c), c.sephora_name || c.product_id) || esc(c.sephora_name || c.product_id)}${c.shade ? ` <span class="muted">· ${esc(c.shade)}</span>` : ''}</td>
      <td><a href="${amzUrl(c.asin)}" target="_blank" rel="noopener" class="mono" title="${esc(c.amazon_title || '')}">${esc(c.asin)}</a><br><a href="${keepaUrl(c.asin)}" target="_blank" rel="noopener" style="font-size:12px">Keepa</a></td>
      <td class="num"><b>${money(c.cost)}</b></td>
      <td class="num">${sephora}</td>
      <td>${isSale(c) ? '<span class="sl-tag reason">On sale</span>' : '<span class="muted">—</span>'}</td>
      <td class="num">${money(c.buybox)}</td>
      <td>${c.sellable === 'open' ? '<span class="sl-tag good">Open</span>' : c.sellable === 'approval_required' ? '<span class="sl-tag warn">Approval</span>' : c.sellable === 'restricted' ? '<span class="sl-tag warn">Restricted</span>' : '<span class="muted">?</span>'}</td>
      <td>${c.confidence ? `<span class="sl-tag ${c.confidence === 'low' ? 'warn' : c.confidence === 'high' ? 'good' : ''}">${esc(c.confidence)}</span>` : '<span class="muted">—</span>'}</td>
      <td class="num"><b class="${roiCls(c.roi_now)}">${pct(c.roi_now)}</b></td>
      <td class="num">${c.lead_score_band != null ? `<span class="band b${esc(c.lead_score_band)}">${esc(c.lead_score_band)}</span> ${pct(c.lead_score_pred_roi)}` : '<span class="muted">—</span>'}</td>
      <td class="num">${num(c.monthly_sold)}</td>
      <td class="num">${num(c.offers_fba)}</td>

  $('#thConf').addEventListener('click', (e) => colPick(e.currentTarget, [['', 'Any confidence'], ['high', 'High'], ['medium', 'Medium'], ['low', 'Low']], 'conf'));
  $('#thChecked').addEventListener('click', (e) => {
    const th = e.currentTarget;
    if (document.querySelector('.brand-pop')) { document.querySelector('.brand-pop').remove(); return; }
    const rc = th.getBoundingClientRect();
    const pop = document.createElement('div'); pop.className = 'brand-pop'; pop.style.width = '220px';
    pop.style.left = Math.max(8, rc.right + window.scrollX - 220) + 'px'; pop.style.top = (rc.bottom + window.scrollY + 4) + 'px';
    const hd = (t, top) => `<li class="muted" style="cursor:default;font-size:11px;text-transform:uppercase;letter-spacing:.05em${top ? ';margin-top:4px' : ''}">${t}</li>`;
    const li = (k, v, t) => `<li data-k="${k}" data-v="${v}" class="${(S[k] || '') === v ? 'on' : ''}">${t}</li>`;
    pop.innerHTML = '<ul style="padding:6px 0">' + hd('Checked by') + li('by', '', 'Anyone or no one') + li('by', 'claude', 'Claude') + li('by', 'people', 'People') + li('by', 'any', 'Anyone (checked only)') +
      hd('When', 1) + li('days', '', 'Any time') + li('days', '1', 'Last 24 hours') + li('days', '7', 'Last 7 days') + li('days', '30', 'Last 30 days') +
      hd('Sort', 1) + `<li data-k="sort" data-v="checked" class="${S.sort === 'checked' ? 'on' : ''}">Most recent first</li>` + `<li data-k="sort" data-v="" class="${S.sort === 'checked' ? '' : ''}">No sort (brand)</li></ul>`;
    const close = () => { pop.remove(); document.removeEventListener('mousedown', outside, true); document.removeEventListener('keydown', onKey); };
    const outside = (ev) => { if (!pop.contains(ev.target) && ev.target !== th) close(); };
    const onKey = (ev) => { if (ev.key === 'Escape') close(); };
    pop.addEventListener('click', (ev) => { const x = ev.target.closest('li[data-k]'); if (!x) return; S[x.dataset.k] = x.dataset.v; close(); sortMarks(); loadCatalog().catch(fail); });
    document.addEventListener('mousedown', outside, true); document.addEventListener('keydown', onKey);
    document.body.append(pop);
  });
  $('#thSell').addEventListener('click', (e) => colPick(e.currentTarget, [['', 'Hide restricted'], ['open', 'Open'], ['approval_required', 'Approval required'], ['restricted', 'Restricted'], ['any', 'All, incl. restricted']], 'sell'));
  $('#thMatch').addEventListener('click', (e) => colPick(e.currentTarget, [['', 'Wrong matches hidden'], ['unchecked', 'Not checked'], ['ok', 'Match OK'], ['wrong', 'Wrong match only'], ['all', 'Everything, incl. wrong']], 'match'));
  $('#thSale').addEventListener('click', (e) => colPick(e.currentTarget, [['', 'On sale or not'], ['1', 'On sale at Sephora'], ['0', 'Not on sale']], 'sale'));
  $('#thBrand').addEventListener('click', () => document.querySelector('.brand-pop') ? document.querySelector('.brand-pop').remove() : openBrandPop());
  ['#fStore'].forEach((id) => $(id).addEventListener('change', () => loadCatalog().catch(fail)));
  // Sort by clicking a column title (Nick, Nov 20 2026; replaces the Sort dropdown): high first, then low first, then brand.
  const sortMarks = () => $$('#catTable th[data-sort]').forEach((th) => {
    const k = th.dataset.sort; th.dataset.label = th.dataset.label || th.textContent;
    th.textContent = th.dataset.label + (S.sort === k ? ' ▼' : S.sort === k + '_asc' ? ' ▲' : '');
  });
  $$('#catTable th[data-sort]').forEach((th) => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    S.sort = S.sort === k ? k + '_asc' : S.sort === k + '_asc' ? '' : k;
    sortMarks(); loadCatalog().catch(fail);
  }));
  sortMarks();
  $('#catMore').addEventListener('click', () => loadCatalog(true).catch(fail));
  let qt; $('#q').addEventListener('input', () => { if (S.view === 'catalog') { clearTimeout(qt); qt = setTimeout(() => loadCatalog().catch(fail), 300); } else renderQueue(); });
  $('#viewSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });

  try {
    await LG.header();
    const v = store.get('sephView');
    setView(['queue', 'decided', 'catalog'].includes(v) ? v : 'queue');
    let t; LG.live((m) => {
      if (m.t === 'sephora' || (!m.t && m.op === 'reload')) {
        if (S.rejecting || document.activeElement?.id === 'rejReason') return;   // don't wipe a half-typed reason
        clearTimeout(t); t = setTimeout(refresh, 800);
      }
    });
  } catch (e) { fail(e); }
})();
</script>
</body>
</html>
