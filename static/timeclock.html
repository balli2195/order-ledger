<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time clock · Myrddin Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441c'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23fff8f2' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<style>
  .tc-top { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 20px; align-items: stretch; }
  @media (max-width: 860px) { .tc-top { grid-template-columns: 1fr; } }
  .tc-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius, 12px); padding: 18px 20px; }
  .tc-card h3 { margin: 0 0 2px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .tc-state { font-size: 15px; margin: 6px 0 2px; }
  .tc-state b { font-weight: 600; }
  .tc-timer { font: 500 38px/1.1 var(--sans); font-variant-numeric: tabular-nums; margin: 6px 0 12px; letter-spacing: -.01em; }
  .tc-timer.off { color: var(--muted); }
  .tc-big { width: 100%; justify-content: center; font-size: 16px; padding: 12px 16px; border-radius: 10px; }
  .tc-big.out { background: var(--ink); border-color: var(--ink); color: var(--panel); }
  .tc-note { margin-top: 8px; }
  .tc-card[hidden] { display: none !important; }
  .tc-weekline { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .tc-on { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  table.wk tr.wk-row { cursor: pointer; }
  table.wk tr.wk-row td:first-child { white-space: nowrap; }
  table.wk .chev { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
  table.wk tr.wk-row.open .chev { transform: rotate(90deg); }
  table.wk tr.wk-row.open td { background: var(--panel-2); border-bottom-color: transparent; }
  table.wk tr.wk-row .cur { font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 1px 7px; margin-left: 6px; font-weight: 600; }
  table.wk td.ph { color: var(--muted); }
  table.wk td.ph b { color: var(--ink); font-weight: 500; }
  table.wk tr.wk-detail > td { background: var(--panel-2); padding: 4px 14px 18px; cursor: default; }
  table.wk tr.wk-detail:hover { background: none; }
  table.wk tr.wk-detail .table-wrap { margin-top: 8px; }
  table.wk tr.wk-detail .tc-sec { margin-top: 14px; font-size: 13px; }
  .tc-weeknav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 26px 0 0; }
  .tc-weeknav h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0 8px 0 0; }
  .tc-weeknav .sp { flex: 1; }
  table.tc td.d, table.tc th.d { text-align: right; font-variant-numeric: tabular-nums; width: 58px; }
  table.tc td.d.zero { color: var(--line); }
  table.tc td.d.today, table.tc th.d.today { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
  table.tc tr.tot td { font-weight: 600; background: var(--panel-2); }
  table.tc tbody tr { cursor: default; }
  table.tc tbody tr.click { cursor: pointer; }
  .tc-adj { display: inline-flex; align-items: center; gap: 4px; background: var(--line-2); border-radius: 99px; padding: 1px 4px 1px 8px; font-size: 12px; margin: 1px 4px 1px 0; white-space: nowrap; }
  .tc-adj.neg { color: var(--bad); }
  .tc-adj button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 3px; font-size: 13px; line-height: 1; }
  .tc-link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; font-size: 12px; }
  .tc-rate { border: 0; background: none; cursor: pointer; font: inherit; color: var(--ink); padding: 0; text-decoration: underline dotted var(--muted); }
  .tc-src { font-size: 11px; color: var(--muted); background: var(--line-2); padding: 1px 7px; border-radius: 99px; }
  .tc-flag { color: var(--bad); font-size: 12px; }
  .tc-sec { margin: 28px 0 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .tc-sec .muted { font-weight: 400; font-size: 13px; }
  .tc-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink); margin: 0 0 6px; }
  .tc-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .tc-chart { position: relative; }
  .tc-chart svg { display: block; width: 100%; height: 190px; overflow: visible; }
  .tc-chart .axis { fill: var(--muted); font-size: 11px; }
  .tc-chart .grid { stroke: var(--line-2); }
  .tc-chart rect.hit { fill: transparent; cursor: pointer; }
  .tc-chart rect.hit:hover { fill: color-mix(in srgb, var(--ink) 5%, transparent); }
  .tc-chart g.cur .seg { stroke: var(--ink); stroke-width: 1.2px; }
  .tc-tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px;
            box-shadow: 0 6px 20px rgba(20,16,10,.14); white-space: nowrap; z-index: 5; }
  .tc-tip b { font-weight: 600; }
  .tc-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .tc-tip .r { display: flex; justify-content: space-between; gap: 14px; }
  .tc-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .tc-form .wide { grid-column: 1 / -1; }
  .tc-people td input, .tc-people td select { padding: 5px 7px; }
  :root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="brand">Myrddin Hub</h1>
    </div>
    <div class="who">
      <span id="whoami" class="muted"></span>
      <button id="menuBtn" class="btn ghost">Menu ▾</button>
      <div id="menu" class="menu hidden">
        <button data-go="/#activity">Activity log</button>
        <button data-go="/#connect">Connect Claude</button>
        <button data-go="/#users" class="owner-only hidden">Users &amp; logins</button>
        <hr>
        <button data-act="logout">Sign out</button>
      </div>
    </div>
  </header>
  <nav class="tabs"><a href="/tasks" data-tab="tasks">Inbox</a><a href="/leads" data-tab="leads">Leads</a><a href="/" data-tab="orders">Orders</a><a href="/stores" data-tab="stores">Stores &amp; brands</a><a href="/inventory-health" data-tab="inventory_health">Inventory health</a><a href="/brand-sellers" data-tab="brand_sellers">Sephora brands</a><a href="/timeclock" data-tab="timeclock" class="on">Time clock</a><a href="/reimbursements" data-tab="reimbursements">Reimbursements</a><a href="/commissions" data-tab="commissions">Commissions</a></nav>

  <div class="tc-weeknav">
    <h2>Weeks</h2>
    <span class="muted" style="font-size:13px">click a week to open it</span>
    <span class="sp"></span>
    <span class="owner-only hidden" style="display:contents">
      <button class="btn small" id="addTime">+ Add time</button>
      <button class="btn small" id="exportBtn">Export CSV</button>
    </span>
  </div>
  <div class="table-wrap"><table class="tc wk" id="wkTable"></table></div>

  <div class="owner-only hidden">
    <div class="tc-sec">People <span class="muted">Link someone to their Hub login so they can clock in themselves. Rates are per hour.</span></div>
    <div class="table-wrap"><table class="tc tc-people" id="pplTable"></table></div>
    <form id="addPerson" class="toolbar" style="margin-top:10px">
      <input name="name" placeholder="Name" style="max-width:200px" required>
      <input name="rate" placeholder="Hourly rate, e.g. 15" style="max-width:170px" inputmode="decimal">
      <button class="btn small">+ Add person</button>
    </form>
  </div>
</div>
<div id="toasts" class="toasts"></div>
<script src="/static/viewas.js"></script>
<script src="/static/clock.js"></script>
<script src="/static/bonus.js"></script>
<script src="/static/common.js"></script>
<script>
(() => {
  const { $, $$, esc, money, api, toast, fail } = LG;
  const TZ = 'America/Chicago';
  const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
  const S = { data: null, week: null, focus: null, timer: null };

  const tFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const dFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
  const partsFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const central = (iso) => { const p = Object.fromEntries(partsFmt.formatToParts(new Date(iso)).map((x) => [x.type, x.value])); return { date: `${p.year}-${p.month}-${p.day}`, hm: `${p.hour}:${p.minute}` }; };
  const day = (ymd) => { const [y, m, d] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)); };
  const short = (ymd, o = { month: 'short', day: 'numeric' }) => day(ymd).toLocaleDateString('en-US', { ...o, timeZone: 'UTC' });
  const addDays = (ymd, n) => { const d = day(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const hrs = (h) => h ? h.toFixed(2) : '';
  const hm = (h) => { const m = Math.round(h * 60); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`; };
  const colorOf = (pid) => { const ids = (S.base?.history.series || []).map((s) => s.id); const i = ids.indexOf(pid); return COLORS[(i < 0 ? 0 : i) % COLORS.length]; };
  const owner = () => S.base?.owner;
  const mondayOf = (ymd) => { const d = day(ymd); const w = (d.getUTCDay() + 6) % 7; return addDays(ymd, -w); };
  // S.base = this week's page data (chart, people, logins); S.list = all weeks; S.cache[week] = one week's detail; S.open = opened weeks
  Object.assign(S, { base: null, list: null, cache: {}, open: null, focus: {} });

  async function load() {
    const [base, list] = await Promise.all([api('GET', '/api/timeclock'), api('GET', '/api/timeclock/weeks')]);
    S.base = base; S.list = list; S.cache = { [base.week_start]: base };
    if (!S.open) S.open = new Set([list.current_week]);
    await Promise.all([...S.open].filter((w) => !S.cache[w]).map(fetchWeek));
    render();
  }
  async function fetchWeek(wk) { S.cache[wk] = await api('GET', '/api/timeclock?week=' + wk); }

  function render() {
    renderWeeks();
    if (owner()) renderPeople();
  }

  // ------------------------------------------------ the weeks table (click a week to open its days and entries)
  function renderWeeks() {
    const L = S.list, own = owner(), ppl = own ? L.people : [];
    const cols = 3 + ppl.length;
    const head = `<thead><tr><th>Week</th>${ppl.map((p) => `<th class="num"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${colorOf(p.id)};margin-right:6px"></i>${esc(p.name)}</th>`).join('')}
      <th class="num">${own ? 'Total hours' : 'Hours'}</th><th class="num">${own ? 'Total pay' : 'Pay'}</th></tr></thead>`;
    if (!L.weeks.some((w) => w.hours || w.pay) && !own) { $('#wkTable').innerHTML = head + `<tbody><tr><td colspan="${cols}" class="empty">No time yet. Use Clock in at the top right to start.</td></tr></tbody>`; return; }
    const body = L.weeks.map((w) => {
      const isOpen = S.open.has(w.week), isCur = w.week === L.current_week;
      const label = `${short(w.week)} – ${short(w.end, w.week.slice(0, 7) === w.end.slice(0, 7) ? { day: 'numeric' } : { month: 'short', day: 'numeric' })}${w.end.slice(0, 4) !== L.today.slice(0, 4) ? ', ' + w.end.slice(0, 4) : ''}`;
      const row = `<tr class="wk-row ${isOpen ? 'open' : ''}" data-wk="${w.week}">
        <td><span class="chev">▸</span> <b>${label}</b>${isCur ? '<span class="cur">this week</span>' : ''}${w.open ? ' <span class="tc-on" title="Someone is clocked in" style="margin-left:6px"></span>' : ''}</td>
        ${ppl.map((p) => { const c = w.people[p.id]; return `<td class="num ph">${c && (c.hours || c.pay) ? `<b>${c.hours.toFixed(2)}</b> h · ${money(c.pay)}` : '·'}</td>`; }).join('')}
        <td class="num"><b>${w.hours.toFixed(2)}</b></td><td class="num"><b>${money(w.pay)}</b></td></tr>`;
      if (!isOpen) return row;
      const d = S.cache[w.week];
      return row + `<tr class="wk-detail" data-wk="${w.week}"><td colspan="${cols}">${d ? weekDetail(d) : '<div class="muted" style="padding:10px">Loading…</div>'}</td></tr>`;
    }).join('');
    $('#wkTable').innerHTML = head + `<tbody>${body}</tbody>`;
  }

  function weekDetail(d) {
    return `<div class="table-wrap"><table class="tc sum">${weekTable(d)}</table></div>
      <div class="tc-sec">Entries <span class="muted">${entriesSub(d)}</span></div>
      <div class="table-wrap"><table class="tc ent">${entriesTable(d)}</table></div>`;
  }

  function weekTable(d) {
    const wk = d.week_start, focus = S.focus[wk];
    const days = DOW.map((n, i) => { const ymd = addDays(wk, i); return { n, ymd, today: ymd === d.today }; });
    const own = d.owner;
    const head = `<thead><tr><th>Person</th>${days.map((x) => `<th class="d ${x.today ? 'today' : ''}">${x.n}<br><span style="font-weight:400">${short(x.ymd)}</span></th>`).join('')}
      <th class="num">Hours</th><th class="num">Rate</th><th class="num">Hourly pay</th><th>Extras</th><th class="num">Total pay</th></tr></thead>`;
    if (!d.people.length) return head + `<tbody><tr><td colspan="13" class="empty">${own ? 'No one on the time clock yet. Add a person below.' : 'No time this week.'}</td></tr></tbody>`;
    const rows = d.people.map((p) => `<tr class="click ${focus === p.id ? 'sel' : ''}" data-pid="${p.id}">
      <td><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${colorOf(p.id)};margin-right:7px"></i><b>${esc(p.name)}</b>${p.open ? ' <span class="tc-on" title="Clocked in now" style="margin-left:4px"></span>' : ''}</td>
      ${p.days.map((h, i) => `<td class="d ${h ? '' : 'zero'} ${days[i].today ? 'today' : ''}">${h ? h.toFixed(2) : '·'}</td>`).join('')}
      <td class="num"><b>${p.hours.toFixed(2)}</b></td>
      <td class="num">${own ? `<button class="tc-rate" data-rate="${p.id}">${p.rate == null ? 'set' : money(p.rate)}</button>` : (p.rate == null ? '—' : money(p.rate))}</td>
      <td class="num">${p.base_pay == null ? '—' : money(p.base_pay)}</td>
      <td>${p.adjustments.map((a) => `<span class="tc-adj ${a.amount < 0 ? 'neg' : ''}">${esc(a.label)} ${money(a.amount)}${own ? `<button data-deladj="${a.id}" title="Remove">×</button>` : ''}</span>`).join('')}${own ? `<button class="tc-link" data-addadj="${p.id}">+ add</button>` : ''}</td>
      <td class="num"><b>${p.pay == null ? '—' : money(p.pay)}</b></td></tr>`).join('');
    let total = '';
    if (d.people.length > 1) {
      const sum = (f) => d.people.reduce((s, p) => s + (f(p) || 0), 0);
      total = `<tr class="tot"><td>All</td>${days.map((x, i) => { const h = sum((p) => p.days[i]); return `<td class="d ${h ? '' : 'zero'}">${h ? h.toFixed(2) : '·'}</td>`; }).join('')}
        <td class="num">${sum((p) => p.hours).toFixed(2)}</td><td></td><td class="num">${money(sum((p) => p.base_pay))}</td>
        <td></td><td class="num">${money(sum((p) => p.pay))}</td></tr>`;
    }
    return head + `<tbody>${rows}${total}</tbody>`;
  }

  function entriesSub(d) {
    const f = S.focus[d.week_start], who = f ? d.people.find((p) => p.id === f)?.name : null;
    return who ? `${esc(who)} only · <button class="tc-link" data-clearfocus>show everyone</button>` : (d.owner ? 'click a row to fix it' : '');
  }

  function entriesTable(d) {
    const own = d.owner, f = S.focus[d.week_start];
    const list = d.entries.filter((e) => !f || e.person_id === f);
    const head = `<thead><tr>${own ? '<th>Person</th>' : ''}<th>Day</th><th>In</th><th>Out</th><th class="num">Hours</th><th>Note</th><th></th></tr></thead>`;
    if (!list.length) return head + `<tbody><tr><td colspan="7" class="empty">No time this week.</td></tr></tbody>`;
    const name = (pid) => d.people.find((p) => p.id === pid)?.name || '';
    return head + `<tbody>${list.map((e) => {
      const cin = central(e.clock_in), cout = e.clock_out ? central(e.clock_out) : null;
      const nextDay = cout && cout.date !== cin.date;
      const zero = e.clock_out && e.clock_out === e.clock_in;
      return `<tr class="${own ? 'click' : ''}" data-eid="${e.id}">
        ${own ? `<td><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${colorOf(e.person_id)};margin-right:7px"></i>${esc(name(e.person_id))}</td>` : ''}
        <td class="tight">${esc(short(e.day, { weekday: 'short', month: 'short', day: 'numeric' }))}</td>
        <td class="tight">${esc(tFmt.format(new Date(e.clock_in)))}</td>
        <td class="tight">${e.clock_out ? esc(tFmt.format(new Date(e.clock_out))) + (nextDay ? ' <span class="muted">(+1 day)</span>' : '') : '<span class="tc-on"></span>still in'}</td>
        <td class="num">${e.hours.toFixed(2)}</td>
        <td class="notes" style="max-width:380px">${zero ? '<span class="tc-flag">⚠ no clock-out</span> ' : ''}${esc(e.note)}</td>
        <td class="tight">${e.source !== 'clock' ? `<span class="tc-src">${e.source === 'import' ? 'from sheet' : esc(e.source)}</span>` : ''}</td></tr>`;
    }).join('')}</tbody>`;
  }

  async function toggleWeek(wk, forceOpen = false) {
    if (S.open.has(wk) && !forceOpen) { S.open.delete(wk); renderWeeks(); return; }
    S.open.add(wk); renderWeeks();
    if (!S.cache[wk]) { try { await fetchWeek(wk); } catch (e) { fail(e); } renderWeeks(); }
  }

  // ------------------------------------------------ people (owner)
  function renderPeople() {
    const d = S.base;
    const users = d.users || [];
    const opts = (p) => `<option value="">— not linked —</option>` + users.map((u) => `<option value="${u.id}" ${p.user_id === u.id ? 'selected' : ''}>${esc(u.label)}</option>`).join('');
    const all = d.people;   // active people + anyone with time this week
    $('#pplTable').innerHTML = `<thead><tr><th>Name</th><th>Hourly rate</th><th>Hub login</th><th>On the clock</th></tr></thead><tbody>${all.map((p) => `<tr data-pid="${p.id}">
      <td><input data-pf="name" value="${esc(p.name)}" style="max-width:200px"></td>
      <td><input data-pf="rate" value="${p.rate ?? ''}" placeholder="15.00" style="max-width:100px" inputmode="decimal"></td>
      <td><select data-pf="user_id" style="max-width:240px">${opts(p)}</select></td>
      <td><label class="check" style="display:inline-flex;flex-direction:row;gap:6px;color:var(--ink)"><input type="checkbox" data-pf="active" ${p.active ? 'checked' : ''} style="width:auto"> active</label></td></tr>`).join('')}</tbody>`;
  }

  // ------------------------------------------------ dialogs
  function dialog(title, inner, onSave, extra = '') {
    const wrap = document.createElement('div'); wrap.className = 'confirm-back';
    wrap.innerHTML = `<div class="confirm-box" role="dialog" aria-modal="true" style="max-width:460px"><h3>${esc(title)}</h3><form>${inner}
      <div class="confirm-actions">${extra}<span style="flex:1"></span><button type="button" class="btn" data-x>Cancel</button><button class="btn primary">Save</button></div></form></div>`;
    document.body.appendChild(wrap);
    const close = () => wrap.remove();
    wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-x]')) close(); });
    wrap.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    wrap.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try { await onSave(Object.fromEntries(new FormData(e.target).entries()), wrap); close(); await load(); } catch (err) { fail(err); }
    });
    wrap.querySelector('input,select')?.focus();
    return { wrap, close };
  }

  function entryDialog(e, d = S.base) {
    const cin = e ? central(e.clock_in) : { date: d.today, hm: '09:00' };
    const cout = e?.clock_out ? central(e.clock_out) : null;
    const people = d.people.filter((p) => p.active || (e && p.id === e.person_id));
    const pick = e ? '' : `<label class="wide">Person<select name="person_id" required>${people.map((p) => `<option value="${p.id}" ${S.focus[d.week_start] === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>`;
    const inner = `<div class="tc-form">${pick}
      <label class="wide">Day<input type="date" name="date" value="${cin.date}" required></label>
      <label>Clock in<input type="time" name="in" value="${cin.hm}" required></label>
      <label>Clock out<input type="time" name="out" value="${cout ? cout.hm : ''}"></label>
      <label class="wide">Note<input name="note" value="${esc(e?.note || '')}" maxlength="500"></label>
      <p class="muted wide" style="margin:0;font-size:12px">Central time. A clock-out earlier than the clock-in is the next morning. Leave clock-out empty only if they're still working.</p></div>`;
    const extra = e ? '<button type="button" class="btn danger" data-del>Delete</button>' : '';
    const { wrap, close } = dialog(e ? `Fix ${d.people.find((p) => p.id === e.person_id)?.name || ''}'s time` : 'Add time', inner, async (body) => {
      if (e) await api('PATCH', `/api/timeclock-admin/entries/${e.id}`, body);
      else await api('POST', '/api/timeclock-admin/entries', body);
      toast('Saved');
    }, extra);
    wrap.querySelector('[data-del]')?.addEventListener('click', async () => {
      if (!confirm('Delete this time entry?')) return;
      try { await api('DELETE', `/api/timeclock-admin/entries/${e.id}`); close(); toast('Deleted'); await load(); } catch (err) { fail(err); }
    });
  }

  function adjDialog(pid, d) {
    const p = d.people.find((x) => x.id === pid);
    dialog(`Extra pay for ${p.name}, week of ${short(d.week_start)}`, `<div class="tc-form">
      <label>Label<input name="label" placeholder="Bonus, Laundry…" required maxlength="80"></label>
      <label>Amount<input name="amount" placeholder="50 or -25" required inputmode="decimal"></label>
      <p class="muted wide" style="margin:0;font-size:12px">Use a minus sign for a deduction (e.g. -25 for a loan payment).</p></div>`,
    async (body) => { await api('POST', '/api/timeclock-admin/adjustments', { ...body, person_id: pid, week_start: d.week_start }); toast('Added'); });
  }

  // ------------------------------------------------ events
  document.addEventListener('click', async (e) => {
    const t = e.target;
    if (t.closest('[data-deladj]')) { e.stopPropagation(); try { await api('DELETE', `/api/timeclock-admin/adjustments/${t.closest('[data-deladj]').dataset.deladj}`); await load(); } catch (err) { fail(err); } return; }
    const wkOf = () => S.cache[t.closest('[data-wk]')?.dataset.wk] || S.base;
    if (t.closest('[data-addadj]')) { e.stopPropagation(); adjDialog(+t.closest('[data-addadj]').dataset.addadj, wkOf()); return; }
    if (t.closest('[data-rate]')) {
      e.stopPropagation(); const pid = +t.closest('[data-rate]').dataset.rate, p = wkOf().people.find((x) => x.id === pid);
      dialog(`Hourly rate for ${p.name}`, `<div class="tc-form"><label class="wide">Rate per hour<input name="rate" value="${p.rate ?? ''}" inputmode="decimal" required></label></div>`,
        async (body) => { await api('PATCH', `/api/timeclock-admin/people/${pid}`, { rate: body.rate }); toast('Rate saved'); });
      return;
    }
    if (t.closest('[data-clearfocus]')) { delete S.focus[wkOf().week_start]; renderWeeks(); return; }
    const wr = t.closest('#wkTable tr.wk-row');
    if (wr) { toggleWeek(wr.dataset.wk); return; }
    const sr = t.closest('#wkTable table.sum tr[data-pid]');
    if (sr) { const d = wkOf(), pid = +sr.dataset.pid; S.focus[d.week_start] = S.focus[d.week_start] === pid ? undefined : pid; renderWeeks(); return; }
    const er = t.closest('#wkTable table.ent tr[data-eid]');
    if (er && owner()) { const d = wkOf(); entryDialog(d.entries.find((x) => x.id === er.dataset.eid), d); }
  });
  $('#addTime').addEventListener('click', () => entryDialog(null));
  $('#exportBtn').addEventListener('click', () => {
    const wk = S.list.current_week;
    dialog('Export time to CSV', `<div class="tc-form"><label>From<input type="date" name="start" value="${addDays(wk, -21)}" required></label>
      <label>To<input type="date" name="end" value="${addDays(wk, 6)}" required></label></div>`,
    async (b) => { location.href = `/api/timeclock-admin/export.csv?start=${b.start}&end=${b.end}`; });
  });
  $('#pplTable').addEventListener('change', async (e) => {
    const f = e.target.dataset.pf; if (!f) return;
    const pid = +e.target.closest('tr').dataset.pid;
    const v = f === 'active' ? e.target.checked : e.target.value;
    try { await api('PATCH', `/api/timeclock-admin/people/${pid}`, { [f]: v }); toast('Saved'); await load(); } catch (err) { fail(err); await load(); }
  });
  $('#addPerson').addEventListener('submit', async (e) => {
    e.preventDefault(); const b = Object.fromEntries(new FormData(e.target).entries());
    try { await api('POST', '/api/timeclock-admin/people', b); e.target.reset(); toast('Added'); await load(); } catch (err) { fail(err); }
  });
  addEventListener('timeclock:changed', () => load().catch(() => {}));

  (async () => {
    try { await LG.header(); await load(); } catch (e) { fail(e); }
    let pend; LG.live((m) => { if (m.t === 'timeclock') { clearTimeout(pend); pend = setTimeout(() => { load().catch(() => {}); window.TimeClock?.refresh(); }, 300); } });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load().catch(() => {}); });
  })();
})();
</script>
</body>
</html>
