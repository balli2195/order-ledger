<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand sellers · Myrddin Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441c'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23fff8f2' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<style>
  .bs-title { margin: 22px 0 2px; font-size: 18px; font-weight: 600; }
  .bs-sub { margin: 0; color: var(--muted); font-size: 13px; }
  .bs-bar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .bs-bar i { display: block; height: 8px; border-radius: 4px; background: var(--accent); min-width: 1px; }
  .bs-bar .track { flex: 1; min-width: 70px; max-width: 170px; display: flex; }
  .bs-bar b { min-width: 32px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bs-tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 99px; font-size: 11px; background: var(--line-2); color: var(--muted); white-space: nowrap; }
  .bs-yes { color: var(--ok); font-weight: 600; }
  .bs-notes { margin: 16px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .bs-notes li { margin: 3px 0; }
  .bs-hist { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="brand">Myrddin Hub</h1>
    </div>
    <div class="who">
      <span id="whoami" class="muted"></span>
      <button id="menuBtn" class="btn ghost">Menu ▾</button>
      <div id="menu" class="menu hidden">
        <button data-go="/#activity">Activity log</button>
        <button data-go="/#connect">Connect Claude</button>
        <button data-go="/#users" class="owner-only hidden">Users &amp; logins</button>
        <hr>
        <button data-act="logout">Sign out</button>
      </div>
    </div>
  </header>
  <nav class="tabs"><a href="/leads" data-tab="leads">Leads</a><a href="/" data-tab="orders">Orders</a><a href="/stores" data-tab="stores">Stores &amp; brands</a><a href="/inventory-health" data-tab="inventory_health">Inventory health</a><a href="/brand-sellers" data-tab="brand_sellers" class="on">Brand sellers</a><a href="/timeclock" data-tab="timeclock">Time clock</a></nav>

  <h2 class="bs-title" id="title">Third-party sellers by brand</h2>
  <p class="bs-sub" id="sub"></p>

  <div class="toolbar">
    <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search brands…" autocomplete="off"></div>
  </div>

  <div class="table-wrap"><table>
    <thead><tr id="head">
      <th class="num sortable" data-k="rank">Rank</th>
      <th class="sortable" data-k="brand">Brand</th>
      <th class="center sortable" data-k="new" title="Approved through the Seller Central request on Nov 2, 2026">Approved Nov 2</th>
      <th class="num sortable" data-k="sellers">3rd-party sellers</th>
      <th class="num sortable" data-k="fba">FBA sellers</th>
      <th class="num sortable" data-k="avg">Avg per ASIN</th>
      <th class="num sortable" data-k="asins">ASINs checked</th>
      <th class="num sortable" data-k="live">With offers</th>
      <th class="num sortable" data-k="me">You're on</th>
      <th>Most contested ASIN</th>
      <th>Your Amazon emails</th>
    </tr></thead>
    <tbody id="rows"></tbody></table>
    <div id="empty" class="empty hidden">Nothing matches.</div>
  </div>
  <ul class="bs-notes" id="notes"></ul>
</div>
<div id="toasts" class="toasts"></div>
<script src="/static/common.js"></script>
<script>
(async () => {
  const { $, $$, esc, num, api, fail } = LG;
  const S = { rows: [], k: 'rank', dir: 1, max: 1 };
  function render() {
    const q = $('#q').value.trim().toLowerCase();
    const rows = S.rows.filter((r) => !q || r.brand.toLowerCase().includes(q));
    rows.sort((a, b) => {
      const x = a[S.k], y = b[S.k];
      const c = typeof x === 'string' ? x.localeCompare(y) : Number(x) - Number(y);
      return (c * S.dir) || (a.rank - b.rank);
    });
    $('#rows').innerHTML = rows.map((r) => `<tr style="cursor:default">
      <td class="num">${r.rank}</td>
      <td>${esc(r.brand)}${r.thin ? '<span class="bs-tag" title="Listings don\'t clearly show this brand. Check by hand.">Thin match</span>' : ''}</td>
      <td class="center">${r.new ? '<span class="bs-yes">✓</span>' : ''}</td>
      <td class="num"><div class="bs-bar"><div class="track"><i style="width:${Math.max(0.5, r.sellers / S.max * 100)}%"></i></div><b>${num(r.sellers)}</b></div></td>
      <td class="num">${num(r.fba)}</td>
      <td class="num">${Number(r.avg).toFixed(1)}</td>
      <td class="num">${num(r.asins)}</td>
      <td class="num">${num(r.live)}</td>
      <td class="num">${num(r.me)}</td>
      <td>${r.top_asin ? `<a href="https://www.amazon.com/dp/${esc(r.top_asin)}" target="_blank" rel="noopener">${esc(r.top_asin)}</a> <span class="muted">(${num(r.top_n)})</span>` : '<span class="muted">—</span>'}</td>
      <td class="bs-hist">${esc(r.hist || '')}</td></tr>`).join('');
    $('#empty').classList.toggle('hidden', rows.length > 0);
    $$('#head th.sortable').forEach((th) => {
      const on = th.dataset.k === S.k;
      th.querySelector('.arrow')?.remove();
      if (on) th.insertAdjacentHTML('beforeend', `<span class="arrow">${S.dir > 0 ? '▲' : '▼'}</span>`);
    });
  }
  $('#q').addEventListener('input', render);
  $('#head').addEventListener('click', (e) => {
    const th = e.target.closest('th.sortable'); if (!th) return;
    const k = th.dataset.k;
    if (S.k === k) S.dir = -S.dir; else { S.k = k; S.dir = (k === 'rank' || k === 'brand') ? 1 : -1; }
    render();
  });
  try {
    await LG.header();
    const d = await api('GET', '/api/docs/brand_sellers/latest');
    const data = d.data || {};
    S.rows = data.rows || [];
    S.max = Math.max(1, ...S.rows.map((r) => r.sellers));
    $('#sub').textContent = data.label || '';
    $('#notes').innerHTML = (data.notes || []).map((n) => `<li>${esc(n)}</li>`).join('');
    render();
  } catch (e) {
    if (String(e.message || e).includes('404')) { $('#empty').textContent = 'No ranking has been loaded yet.'; $('#empty').classList.remove('hidden'); }
    else fail(e);
  }
})();
</script>
</body>
</html>
