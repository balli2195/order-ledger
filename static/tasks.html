<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inbox · Myrddin Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4441c'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='%23fff8f2' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<style>
  .tk-add { display: grid; grid-template-columns: 1fr 160px auto; gap: 8px; margin: 22px 0 4px; align-items: start; }
  .tk-add textarea { grid-column: 1 / -1; min-height: 38px; resize: vertical; }
  @media (max-width: 700px) { .tk-add { grid-template-columns: 1fr; } .tk-add textarea { grid-column: auto; } }
  .tk-list { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .tk { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line-2); align-items: start; }
  .tk:last-child { border-bottom: 0; }
  .tk input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; accent-color: var(--ok); }
  .tk .t { font-weight: 600; }
  .tk.done .t { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .tk .d { white-space: pre-wrap; color: var(--ink); font-size: 13px; margin-top: 3px; }
  .tk.done .d { color: var(--muted); }
  .tk .m { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tk .tag { font-size: 11px; border-radius: 99px; padding: 1px 8px; background: var(--line-2); color: var(--muted); }
  .tk .tag.auto { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tk .tag.rec { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); font-weight: 600; }
  .rt-row { display: grid; grid-template-columns: 1fr 130px auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
  .rt-row input[type=text], .rt-row select { padding: 6px 8px; }
  .rt-row .opts { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
  .rt-row .opts label { display: inline-flex; flex-direction: row; gap: 4px; align-items: center; color: var(--ink); font-weight: 400; font-size: 12px; }
  .rt-row .opts input { width: auto; }
  .rt-row.off input[type=text] { color: var(--muted); text-decoration: line-through; }
  .tk .tag.late { background: var(--warn-soft); color: var(--bad); font-weight: 600; }
  .tk .acts { display: flex; gap: 2px; }
  .tk-empty { padding: 36px; text-align: center; color: var(--muted); }
  .sec-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 26px 0 0; }
  .sec-h h2 { font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0 6px 0 0; }
  .sec-h select { width: auto; padding: 4px 8px; }
  .dg-headline { margin: 8px 0 0; font-size: 15px; max-width: 900px; }
  .inbox-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 1000px) { .inbox-grid { grid-template-columns: minmax(0, 1fr); } }
  .dg-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 14px; overflow: hidden; }
  .dg-sec { border-top: 1px solid var(--line); padding: 2px 0; }
  .dg-sec:first-child { border-top: 0; }
  .dg-sec > summary { background: var(--panel-2); }
  .dg-sec > summary { list-style: none; cursor: pointer; padding: 10px 16px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dg-sec > summary::-webkit-details-marker { display: none; }
  .dg-sec > summary .n { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
  .dg-sec > summary .chev { color: var(--muted); transition: transform .15s; font-size: 11px; }
  .dg-sec[open] > summary .chev { transform: rotate(90deg); }
  .dg-it { padding: 9px 16px 10px; border-top: 1px solid var(--line-2); font-size: 13px; }
  .dg-it .ti { font-weight: 600; }
  .dg-it .ti .u { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 6px; vertical-align: 1px; }
  .dg-it .su { margin-top: 2px; }
  .dg-it .ac { margin-top: 3px; color: var(--accent); }
  .dg-it .mt { margin-top: 3px; color: var(--muted); font-size: 12px; }
  .dg-empty { margin-top: 12px; padding: 26px; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 class="brand">Myrddin Hub</h1>
    </div>
    <div class="who">
      <span id="whoami" class="muted"></span>
      <button id="menuBtn" class="btn ghost">Menu ▾</button>
      <div id="menu" class="menu hidden">
        <button data-go="/#activity">Activity log</button>
        <button data-go="/#connect">Connect Claude</button>
        <button data-go="/#users" class="owner-only hidden">Users &amp; logins</button>
        <hr>
        <button data-act="logout">Sign out</button>
      </div>
    </div>
  </header>
  <nav class="tabs"><a href="/tasks" data-tab="tasks" class="on">Inbox</a><a href="/leads" data-tab="leads">Leads</a><a href="/" data-tab="orders">Orders</a><a href="/stores" data-tab="stores">Stores &amp; brands</a><a href="/inventory-health" data-tab="inventory_health">Inventory health</a><a href="/brand-sellers" data-tab="brand_sellers">Sephora brands</a><a href="/timeclock" data-tab="timeclock">Time clock</a></nav>

  <div class="inbox-grid"><div class="col-mail">
  <div class="sec-h"><h2>Amazon emails</h2><select id="dgDay" aria-label="Day"></select><span class="muted" id="dgMeta" style="font-size:13px"></span></div>
  <p class="dg-headline" id="dgHeadline"></p>
  <div id="dgBody"></div>
  </div><div class="col-tasks">

  <div class="sec-h"><h2>Tasks</h2></div>
  <form class="tk-add editor-only" id="addForm" style="margin-top:12px">
    <input name="title" placeholder="New task…" maxlength="300" required autocomplete="off">
    <input name="due" type="date" title="Due date (optional)">
    <button class="btn primary">Add task</button>
    <textarea name="details" placeholder="Details (optional)" rows="1" maxlength="5000"></textarea>
  </form>

  <div class="toolbar" style="margin-top:16px">
    <div class="chips" role="tablist">
      <button class="chip on" data-f="open">Open<span class="count" id="cOpen"></span></button>
      <button class="chip" data-f="done">Done<span class="count" id="cDone"></span></button>
      <button class="chip" data-f="all">All</button>
    </div>
    <button class="btn small editor-only" id="recBtn" title="Tasks that come back every day, weekday, week or month">↻ Recurring tasks</button>
    <span class="muted" style="font-size:13px">Tagged tasks are added automatically: <b style="color:var(--accent)">Hub</b> for canceled orders already sent to PrepOS, <b style="color:var(--accent)">Amazon email</b> for emails that need action.</span>
  </div>

  <div class="tk-list" id="list"></div>
  </div></div>
</div>
<div id="toasts" class="toasts"></div>
<script src="/static/viewas.js"></script>
<script src="/static/clock.js"></script>
<script src="/static/common.js"></script>
<script>
(() => {
  const { $, $$, esc, api, toast, fail, fmtDate } = LG;
  const S = { tasks: [], f: 'open' };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* ignore */ } } };
  const canEdit = () => LG.can('editor') && !LG.st.me?.viewed_by;
  const when = (iso) => iso ? new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  const todayStr = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });

  // ------------------------------------------------ daily Amazon email summary
  async function loadDigest(day) {
    const d = await api('GET', '/api/amazon-digest' + (day ? '?day=' + day : ''));
    const sel = $('#dgDay');
    sel.innerHTML = d.days.map((x) => `<option value="${x}" ${x === d.day ? 'selected' : ''}>${esc(fmtDate(x))}</option>`).join('') || '<option>—</option>';
    if (!d.data) { $('#dgHeadline').textContent = ''; $('#dgMeta').textContent = ''; $('#dgBody').innerHTML = '<div class="dg-empty">No summary yet. The daily Amazon email check runs every morning.</div>'; return; }
    const g = d.data;
    $('#dgHeadline').textContent = g.headline || '';
    $('#dgMeta').textContent = [g.period, d.updated_at ? 'updated ' + when(d.updated_at) : ''].filter(Boolean).join(' · ');
    const secs = (g.sections || []).filter((x) => (x.items || []).length);
    $('#dgBody').innerHTML = secs.length ? `<div class="dg-panel">${secs.map((x) => {
      const urgent = x.items.filter((i) => i.urgent).length;
      return `<details class="dg-sec" ${x.collapsed ? '' : 'open'}><summary><span class="chev">▶</span>${esc(x.name)}<span class="n">${urgent ? `<b style="color:var(--bad)">${urgent} need action</b> · ` : ''}${x.items.length}</span></summary>
        ${x.items.map((i) => `<div class="dg-it"><div class="ti">${i.urgent ? '<span class="u" title="Needs action"></span>' : ''}${esc(i.title)}</div>
          ${i.summary ? `<div class="su">${esc(i.summary)}</div>` : ''}${i.action ? `<div class="ac">→ ${esc(i.action)}</div>` : ''}
          <div class="mt">${esc(i.date || '')}${i.link ? `${i.date ? ' · ' : ''}<a href="${esc(i.link)}" target="_blank" rel="noopener">Open email ↗</a>` : ''}</div></div>`).join('')}</details>`;
    }).join('')}</div>` : '<div class="dg-empty">No Amazon emails that day.</div>';
  }
  $('#dgDay').addEventListener('change', (e) => loadDigest(e.target.value).catch(fail));

  async function load() {
    const d = await api('GET', '/api/tasks');
    S.tasks = d.tasks; render();
    window.dispatchEvent(new Event('tasks:changed'));
  }

  function render() {
    const open = S.tasks.filter((t) => t.status === 'open'), done = S.tasks.filter((t) => t.status === 'done');
    $('#cOpen').textContent = open.length || ''; $('#cDone').textContent = done.length || '';
    const list = S.f === 'open' ? open : S.f === 'done' ? done : S.tasks;
    if (!list.length) { $('#list').innerHTML = `<div class="tk-empty">${S.f === 'open' ? 'Nothing to do. 🎉' : 'No tasks here.'}</div>`; return; }
    const ed = canEdit();
    $('#list').innerHTML = list.map((t) => {
      const late = t.status === 'open' && t.due && t.due < todayStr();
      return `<div class="tk ${t.status}" data-id="${esc(t.id)}">
        <input type="checkbox" data-act="toggle" ${t.status === 'done' ? 'checked' : ''} ${ed ? '' : 'disabled'} title="${t.status === 'done' ? 'Mark not done' : 'Mark done'}">
        <div><div class="t">${esc(t.title)}</div>${t.details ? `<div class="d">${esc(t.details)}</div>` : ''}
          <div class="m">${t.kind === 'recurring' ? `<span class="tag rec">↻ ${esc(FREQ_LABEL[t.freq] || 'Recurring')}</span>${late ? `<span class="tag late">carried over from ${esc(fmtDate(t.for_date))}</span>` : t.status === 'done' ? `<span>${esc(fmtDate(t.for_date))}</span>` : ''}`
              : `${t.kind !== 'manual' ? `<span class="tag auto">${t.kind === 'amazon_email' ? 'Amazon email' : 'Hub'}</span>` : ''}${t.due ? `<span class="tag ${late ? 'late' : ''}">due ${esc(fmtDate(t.due))}</span>` : ''}
            <span>added ${esc(when(t.created_at))}${t.created_by_name ? ' by ' + esc(t.created_by_name) : ''}</span>`}
            ${t.status === 'done' ? `<span>· done ${esc(when(t.done_at))}${t.done_by_name ? ' by ' + esc(t.done_by_name) : ''}</span>` : ''}
            ${t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">${t.link.includes('mail.google') || t.link.includes('outlook') ? 'Open email ↗' : t.link.includes('amazon.com') ? 'Amazon ↗' : 'open ↗'}</a>` : ''}</div></div>
        <div class="acts">${ed ? `<button class="icon-btn" data-act="edit" title="Edit">✎</button>${t.kind === 'recurring' ? '' : '<button class="icon-btn" data-act="del" title="Delete">🗑</button>'}` : ''}</div></div>`;
    }).join('');
  }

  const FREQ_LABEL = { daily: 'Daily', weekdays: 'Weekdays', weekly: 'Weekly', monthly: 'Monthly' };
  const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  // ------------------------------------------------ recurring tasks: manage the list
  async function recurringDialog() {
    const wrap = document.createElement('div'); wrap.className = 'confirm-back';
    wrap.innerHTML = `<div class="confirm-box" role="dialog" aria-modal="true" style="max-width:640px;width:100%">
      <h3>Recurring tasks</h3>
      <p class="muted" style="font-size:13px;margin:0 0 6px">These show up in your task list on the days they're due. If one isn't checked off, it carries over (no pile-up). Changes save as you go.</p>
      <div id="rtList"></div>
      <form id="rtAdd" class="rt-row" style="border-bottom:0;margin-top:6px">
        <input type="text" name="title" placeholder="New recurring task…" maxlength="300" required>
        <select name="freq">${Object.entries(FREQ_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        <button class="btn small primary">Add</button><span></span>
      </form>
      <div class="confirm-actions"><button class="btn" data-x>Done</button></div></div>`;
    document.body.appendChild(wrap);
    const close = () => { wrap.remove(); load().catch(() => {}); };
    wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-x]')) close(); });
    const draw = async () => {
      const { templates } = await api('GET', '/api/task-templates');
      wrap.querySelector('#rtList').innerHTML = templates.length ? templates.map((t) => `<div class="rt-row ${t.active ? '' : 'off'}" data-tid="${esc(t.id)}">
        <input type="text" data-rf="title" value="${esc(t.title)}" maxlength="300">
        <select data-rf="freq">${Object.entries(FREQ_LABEL).map(([k, v]) => `<option value="${k}" ${t.freq === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <button class="btn small ghost" data-rf="active" title="${t.active ? 'Pause' : 'Resume'}">${t.active ? 'Pause' : 'Resume'}</button>
        <button class="icon-btn" data-rf="del" title="Delete">🗑</button>
        ${t.freq === 'weekly' ? `<div class="opts">On ${DOW.map((d, i) => `<label><input type="checkbox" data-rf="day" value="${i}" ${(t.days || []).includes(i) ? 'checked' : ''}> ${d}</label>`).join('')}</div>` : ''}
        ${t.freq === 'monthly' ? `<div class="opts">On day <input type="number" data-rf="monthday" min="1" max="31" value="${t.monthday || 1}" style="width:64px;padding:4px 6px"> of each month</div>` : ''}
      </div>`).join('') : '<p class="muted">No recurring tasks yet.</p>';
    };
    const save = async (tid, body) => { try { await api('PATCH', `/api/task-templates/${tid}`, body); } catch (err) { fail(err); } await draw(); };
    wrap.querySelector('#rtList').addEventListener('change', async (e) => {
      const row = e.target.closest('[data-tid]'); if (!row) return; const tid = row.dataset.tid, f = e.target.dataset.rf;
      if (f === 'title') await save(tid, { title: e.target.value });
      else if (f === 'freq') await save(tid, e.target.value === 'weekly' ? { freq: 'weekly', days: [0] } : e.target.value === 'monthly' ? { freq: 'monthly', monthday: 1 } : { freq: e.target.value });
      else if (f === 'day') await save(tid, { days: [...row.querySelectorAll('[data-rf="day"]:checked')].map((x) => +x.value) });
      else if (f === 'monthday') await save(tid, { monthday: e.target.value });
    });
    wrap.querySelector('#rtList').addEventListener('click', async (e) => {
      const b = e.target.closest('button[data-rf]'); if (!b) return; const row = b.closest('[data-tid]'), tid = row.dataset.tid;
      if (b.dataset.rf === 'active') await save(tid, { active: row.classList.contains('off') });
      if (b.dataset.rf === 'del' && confirm(`Delete "${row.querySelector('[data-rf=title]').value}"? It stops coming back.`)) {
        try { await api('DELETE', `/api/task-templates/${tid}`); } catch (err) { fail(err); } await draw();
      }
    });
    wrap.querySelector('#rtAdd').addEventListener('submit', async (e) => {
      e.preventDefault(); const b = Object.fromEntries(new FormData(e.target).entries());
      if (b.freq === 'weekly') b.days = [new Date().getDay() === 0 ? 6 : new Date().getDay() - 1];
      if (b.freq === 'monthly') b.monthday = new Date().getDate();
      try { await api('POST', '/api/task-templates', b); e.target.reset(); await draw(); } catch (err) { fail(err); }
    });
    await draw();
    wrap.querySelector('#rtAdd input').focus();
  }

  function editDialog(t) {
    const wrap = document.createElement('div'); wrap.className = 'confirm-back';
    wrap.innerHTML = `<div class="confirm-box" role="dialog" aria-modal="true" style="max-width:520px"><h3>Edit task</h3><form style="display:grid;gap:10px">
      <label>Title<input name="title" value="${esc(t.title)}" maxlength="300" required></label>
      <label>Details<textarea name="details" rows="5" maxlength="5000">${esc(t.details || '')}</textarea></label>
      <label>Due<input name="due" type="date" value="${esc(t.due || '')}"></label>
      <div class="confirm-actions"><button type="button" class="btn" data-x>Cancel</button><button class="btn primary">Save</button></div></form></div>`;
    document.body.appendChild(wrap);
    wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-x]')) wrap.remove(); });
    wrap.querySelector('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try { await api('PATCH', `/api/tasks/${t.id}`, Object.fromEntries(new FormData(e.target).entries())); wrap.remove(); toast('Saved'); await load(); } catch (err) { fail(err); }
    });
    wrap.querySelector('input').focus();
  }

  $('#list').addEventListener('click', async (e) => {
    const row = e.target.closest('.tk'); if (!row) return;
    const t = S.tasks.find((x) => x.id === row.dataset.id); if (!t) return;
    const act = e.target.closest('[data-act]')?.dataset.act;
    try {
      if (act === 'toggle') { await api('PATCH', `/api/tasks/${t.id}`, { status: t.status === 'done' ? 'open' : 'done' }); await load(); }
      else if (act === 'edit') editDialog(t);
      else if (act === 'del') { if (confirm(`Delete "${t.title}"?`)) { await api('DELETE', `/api/tasks/${t.id}`); toast('Deleted'); await load(); } }
    } catch (err) { fail(err); await load(); }
  });
  $('#addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await api('POST', '/api/tasks', Object.fromEntries(new FormData(e.target).entries())); e.target.reset(); toast('Added'); S.f === 'done' && setF('open'); await load(); } catch (err) { fail(err); }
  });
  $('#recBtn').addEventListener('click', () => recurringDialog().catch(fail));
  function setF(f) { S.f = f; store.set('taskFilter', f); $$('.chip[data-f]').forEach((c) => c.classList.toggle('on', c.dataset.f === f)); render(); }
  $$('.chip[data-f]').forEach((c) => c.addEventListener('click', () => setF(c.dataset.f)));

  (async () => {
    try {
      await LG.header();
      $$('.editor-only').forEach((el) => el.classList.toggle('hidden', !canEdit()));
      const f = store.get('taskFilter'); if (['open', 'done', 'all'].includes(f)) setF(f);
      await Promise.all([load(), loadDigest()]);
    } catch (e) { fail(e); }
    let pend; LG.live((m) => { if (m.t === 'task') { clearTimeout(pend); pend = setTimeout(() => { load().catch(() => {}); if (m.op === 'digest') loadDigest().catch(() => {}); }, 300); } });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load().catch(() => {}); });
  })();
})();
</script>
</body>
</html>
