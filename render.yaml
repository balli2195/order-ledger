# Render Blueprint (for reference / re-creating the stack). The live services were created via the Render API.
databases:
  - name: order-ledger-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: order-ledger
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: order-ledger-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true

  # Keepa collector (Nov 11, 2026): always-on background worker, jobs/keepa_collector/collector.py.
  # Writes keepa_raw / keepa_snapshots / keepa_collector_status in the Hub database.
  - type: worker
    name: keepa-collector
    runtime: python
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python3 jobs/keepa_collector/collector.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: order-ledger-db
          property: connectionString
      - key: KEEPA_KEY
        sync: false
